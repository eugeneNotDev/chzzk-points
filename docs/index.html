<body>

  <div class="app-shell">

      <nav class="sidebar-nav">

        </a>
        <a href="notice.html">

          <span class="label">공지사항</span>

        <a href="ranking.html">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 5H4v2a4 4 0 0 0 4 4"/><path d="M16 5h4v2a4 4 0 0 1-4 4"/><path d="M12 13v3"/><path d="M9 20h6"/><path d="M10 20v-2h4v2"/></svg></span>
          <span class="label">랭킹</span>
        </a>
        <div class="sidebar-nav-group">
          <button type="button" class="sidebar-nav-toggle" id="shop-nav-toggle">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></span>

          </div>
        </div>
        <a href="predict.html">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg></span>
          <span class="label">투표</span>
        </a>
        <a href="attendance.html">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg></span>
          <span class="label">출석체크</span>
        </a>
        <a href="mypage.html">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg></span>
          <span class="label">마이페이지</span>
        </a>
        <a href="admin.html" id="admin-nav-link" hidden>
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l7 4v6c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6l7-4z"/></svg></span>
          <span class="label">관리자</span>

      <div class="sidebar-user" id="sidebar-user"></div>

    <main class="main-content">
      <h1 class="brand-heading home-heading">유진 팬보드</h1>

      <div class="card">
        <div id="status-skeleton" class="skeleton skeleton-pill"></div>
        <div id="status-badge" class="status-badge offline" hidden>
          <span class="dot"></span>
          <span id="status-text"></span>
        </div>
        <p id="live-title" class="live-title" hidden></p>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>공지사항</h2>
          <a href="notice.html" class="pill-link">
            전체 보기
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </a>
        </div>

        <ul class="notice-list" id="notice-preview">
          <li class="skeleton-row"><span class="skeleton skeleton-line grow"></span></li>
          <li class="skeleton-row"><span class="skeleton skeleton-line grow"></span></li>
        </ul>
        <p id="notice-empty" class="empty-state" hidden>등록된 공지사항이 없어요.</p>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>랭킹 미리보기</h2>
          <a href="ranking.html" class="pill-link">
            전체 보기
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </a>
        </div>
        <ol class="ranking-list" id="ranking-preview">
          <li class="skeleton-row"><span class="skeleton skeleton-avatar"></span><span class="skeleton skeleton-line grow"></span></li>
          <li class="skeleton-row"><span class="skeleton skeleton-avatar"></span><span class="skeleton skeleton-line grow"></span></li>
          <li class="skeleton-row"><span class="skeleton skeleton-avatar"></span><span class="skeleton skeleton-line grow"></span></li>
        </ol>
        <p id="ranking-empty" class="empty-state" hidden>아직 랭킹에 등록된 유저가 없어요.</p>
      </div>

      <!-- 미리보기에서 제목 누르면 페이지 이동 없이 여기서 바로 내용을 보여줌(보기 전용 —
           글쓰기/수정/삭제 같은 관리는 공지사항 탭에서). -->
      <dialog id="notice-modal" class="notice-modal">
        <h3 id="notice-modal-title"></h3>
        <p class="muted" id="notice-modal-meta"></p>
        <p class="notice-modal-content" id="notice-modal-content"></p>
        <div class="notice-image-gallery" id="notice-modal-gallery" hidden></div>
        <div class="notice-file-list" id="notice-modal-files" hidden></div>
        <div class="notice-modal-actions">
          <button type="button" class="secondary" id="notice-modal-close-btn">닫기</button>
        </div>
      </dialog>
    </main>
  </div>

  <script src="assets/js/chzzk-auth.js?v=17"></script>
  <script src="assets/js/spa-router.js?v=8"></script>
  <script>
  // 라우터(spa-router.js)가 페이지 이동할 때마다 이 스크립트를 다시 실행하므로,
  // 최상위에 const/let을 두면 두 번째 실행에서 "이미 선언됨" 에러가 남 — 그래서 전체를
  // 즉시실행함수(IIFE)로 감쌈. supabase는 type=module 정적 import 대신 동적 import()로
  // 가져옴 (동적 import는 매번 새로 실행해도 안전하고, 이미 로드된 모듈은 캐시해서 씀).
  (function () {
    let supabase;

    const RANKING_PREVIEW_LIMIT = 10;
    const NOTICE_PREVIEW_LIMIT = 5;

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // 방송 중인지: 인증 불필요, 로그인 여부와 무관하게 누구나 조회 가능.
    async function loadBroadcastStatus() {
      const skeletonEl = document.getElementById("status-skeleton");
      const badgeEl = document.getElementById("status-badge");
      const textEl = document.getElementById("status-text");
      const titleEl = document.getElementById("live-title");
      try {
        const res = await fetch(BROADCAST_STATUS_URL);
        const data = await res.json();
        if (data.isLive) {
          badgeEl.className = "status-badge live";
          textEl.textContent = "방송 중";
          if (data.liveTitle) {
            titleEl.textContent = data.liveTitle;
            titleEl.hidden = false;
          } else {
            titleEl.hidden = true;
          }
        } else {
          badgeEl.className = "status-badge offline";
          textEl.textContent = "방송 종료";
          titleEl.hidden = true;
        }
      } catch (err) {
        console.error("[index] 방송 상태 조회 실패", err);
        badgeEl.className = "status-badge offline";
        textEl.textContent = "상태를 확인할 수 없어요";
      } finally {
        skeletonEl.hidden = true;
        badgeEl.hidden = false;
      }
    }

    // 홈 화면은 최신 공지 몇 개만 제목으로 보여주는 미리보기. 제목을 누르면 다른 페이지로
    // 이동하지 않고 그 자리에서 팝업으로 내용을 보여줌(보기 전용). 글쓰기/수정/삭제 같은
    // 관리 기능은 공지사항 탭(notice.html)에서 게시판 형태로 처리함.
    let noticePreviewById = new Map();

    // 사이드바 알림 점과 같은 기준(NOTICE_LAST_SEEN_KEY)을 읽기만 해서(변경 안 함) 미리보기에도
    // "새 글" 표시를 달아줌 — 스크립트가 실행되자마자(=initNoticeBadge()가 markNoticesSeen()을
    // 부르기 전, 애초에 이 페이지에선 initNoticeBadge()가 값을 갱신하지도 않음) 한 번 읽어서 고정.
    const noticeListSeenBaseline = getNoticeLastSeenAt();

    function renderNoticePreviewItem(n) {
      const isNew = !!noticeListSeenBaseline && new Date(n.created_at) > new Date(noticeListSeenBaseline);
      const newTag = isNew ? `<span class="notice-new-tag">NEW</span>` : "";
      return `
        <li class="notice-item">
          <button type="button" class="notice-title-btn" data-id="${n.id}">${newTag}${escapeHtml(n.title || "(제목 없음)")}</button>
          <div class="notice-item-footer">
            <time>${new Date(n.created_at).toLocaleString("ko-KR")}</time>
          </div>
        </li>`;
    }

    function wireNoticePreviewButtons() {
      document.querySelectorAll("#notice-preview .notice-title-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const n = noticePreviewById.get(btn.dataset.id);
          if (n) openNoticeModal(n);
          // notice.html과 같은 이유 — noticeListSeenBaseline이 이번 방문 동안 고정이라
          // 팝업만 열었다 닫아선 NEW가 안 사라짐. 실제로 읽은 글의 NEW만 바로 지워줌.
          const tag = btn.querySelector(".notice-new-tag");
          if (tag) tag.remove();
        });
      });
    }

    function openNoticeModal(n) {
      const editedLabel = n.updated_at && n.updated_at !== n.created_at ? " (수정됨)" : "";
      document.getElementById("notice-modal-title").textContent = n.title || "(제목 없음)";
      document.getElementById("notice-modal-meta").textContent = new Date(n.created_at).toLocaleString("ko-KR") + editedLabel;
      document.getElementById("notice-modal-content").textContent = n.content;

      const sortedAttachments = (n.notice_attachments || []).slice().sort((a, b) => a.sort_order - b.sort_order);
      const { galleryHtml, fileListHtml } = renderNoticeAttachmentsHtml(sortedAttachments);
      const galleryEl = document.getElementById("notice-modal-gallery");
      const filesEl = document.getElementById("notice-modal-files");
      galleryEl.innerHTML = galleryHtml;
      galleryEl.hidden = galleryHtml.length === 0;
      filesEl.innerHTML = fileListHtml;
      filesEl.hidden = fileListHtml.length === 0;

      const dialog = document.getElementById("notice-modal");
      // 이미지가 있는 글이면 팝업을 넓혀서 크게 보여줌(style.css .has-images).
      dialog.classList.toggle("has-images", galleryHtml.length > 0);
      if (!dialog.open) dialog.showModal();
    }

    function setupNoticeModal() {
      const dialog = document.getElementById("notice-modal");
      document.getElementById("notice-modal-close-btn").addEventListener("click", () => dialog.close());
      // 배경(backdrop) 클릭 시 닫기 — dialog 엘리먼트 자체를 클릭한 경우만(안쪽 내용 클릭은 버블링 안 됨).
      dialog.addEventListener("click", (e) => {
        if (e.target === dialog) dialog.close();
      });
    }

    async function loadNoticePreview() {
      const listEl = document.getElementById("notice-preview");
      const emptyEl = document.getElementById("notice-empty");
      const { data, error } = await supabase
        .from("notices")
        .select("id, title, content, created_at, updated_at, notice_attachments(id, kind, file_name, storage_path, mime_type, size_bytes, sort_order)")
        .order("created_at", { ascending: false })
        .order("sort_order", { referencedTable: "notice_attachments", ascending: true })
        .limit(NOTICE_PREVIEW_LIMIT);

      if (error) {
        console.error("[index] 공지 조회 실패", error);
        emptyEl.textContent = "공지사항을 불러오지 못했어요.";
        emptyEl.hidden = false;
        listEl.innerHTML = "";
        return;
      }
      if (!data || data.length === 0) {
        noticePreviewById = new Map();
        emptyEl.hidden = false;
        listEl.innerHTML = "";
        return;
      }
      emptyEl.hidden = true;
      noticePreviewById = new Map(data.map((n) => [String(n.id), n]));
      listEl.innerHTML = data.map((n) => renderNoticePreviewItem(n)).join("");
      wireNoticePreviewButtons();
    }

    // 랭킹 한 줄 렌더링. 비공개 유저는 이름이 이미 "비공개"로 가려져서 내려옴(뷰에서 처리) —
    // 본인 행도 예외 없이 그대로 보여줌. (전엔 본인 행만 로컬에 저장된 실제 채널명으로 덮어썼는데,
    // 그러면 비공개로 설정해도 본인 눈에는 계속 실명이 보여서 설정이 잘 적용됐는지 헷갈린다는
    // 피드백이 있었음 — 그래서 본인도 남들과 똑같이 마스킹된 값을 그대로 보게 함.) 포인트 구간
    // 칭호는 이름 색으로, 상점 구매 칭호는 배지로 — ranking.html과 같은 chzzk-auth.js 공용
    // 함수(applyTierColorToName/renderShopTitleBadgeHtml)를 그대로 씀 — 별도로 다시 만들면
    // 나중에 한쪽만 고치고 잊어버리기 쉬워서(이번에 실제로 그랬음) 반드시 공용 함수로.
    function renderRankingRow(row, i, myChannelId) {
      const isMe = row.channel_id === myChannelId;
      const isPrivate = row.is_public === false;
      const shopBadge = renderShopTitleBadgeHtml(row.shop_title_name);
      const coloredName = applyTierColorToName(escapeHtml(row.channel_name || "(이름 없음)"), row.tier_title_color);
      return `
        <li class="${isMe ? "me" : ""}">
          <span class="rank">${i + 1}</span>
          <span class="name${isPrivate ? " is-private" : ""}">${shopBadge}${coloredName}${isMe ? " (나)" : ""}</span>
          <span class="points">${row.total_points.toLocaleString("ko-KR")}P</span>
        </li>`;
    }

    async function loadRankingPreview() {
      const listEl = document.getElementById("ranking-preview");
      const emptyEl = document.getElementById("ranking-empty");
      const { data, error } = await supabase
        .from("ranking")
        .select("channel_id, channel_name, total_points, is_public, tier_title_name, tier_title_color, shop_title_name")
        .order("total_points", { ascending: false })
        .limit(RANKING_PREVIEW_LIMIT);

      if (error) {
        console.error("[index] 랭킹 조회 실패", error);
        emptyEl.textContent = "랭킹을 불러오지 못했어요.";
        emptyEl.hidden = false;
        listEl.innerHTML = "";
        return;
      }
      if (!data || data.length === 0) {
        emptyEl.hidden = false;
        listEl.innerHTML = "";
        return;
      }
      emptyEl.hidden = true;
      const myChannelId = getChannelId();
      listEl.innerHTML = data.map((row, i) => renderRankingRow(row, i, myChannelId)).join("");
    }

    (async () => {
      ({ supabase } = await import("./assets/js/supabase-client.js"));
      await handleOAuthCallbackIfPresent();
      renderSidebarUser();
      initSidebarToggle();
      initAdminNav();
      initShopNavGroup();
      initNoticeBadge();
      verifySessionInBackground();
      setupNoticeModal();
      await Promise.all([loadBroadcastStatus(), loadNoticePreview(), loadRankingPreview()]);

      // 실시간 갱신: 공지 미리보기 + 랭킹 미리보기 둘 다 구독함. 랭킹은 points_ledger가
      // RLS로 막혀있어서 직접 구독 못 하고, 대신 트리거가 채워주는 ranking_pings(공개 읽기
      // 테이블)를 구독함(0019_admin_features.sql 참고) — ranking.html과 동일한 패턴.
      // 관리자가 일괄 지급하면 짧은 시간에 ping이 여러 번 올 수 있어 debounce로 묶음.
      let noticeRefetchTimer = null;
      let rankingRefetchTimer = null;
      const noticeChannel = supabase
        .channel("notices_index_preview")
        .on("postgres_changes", { event: "*", schema: "public", table: "notices" }, () => {
          clearTimeout(noticeRefetchTimer);
          noticeRefetchTimer = setTimeout(() => {
            if (!document.getElementById("notice-preview")) return; // 이미 다른 페이지로 이동함
            loadNoticePreview();
          }, 500);
        })
        .subscribe();
      const rankingChannel = supabase
        .channel("ranking_pings_index_preview")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "ranking_pings" }, () => {
          clearTimeout(rankingRefetchTimer);
          rankingRefetchTimer = setTimeout(() => {
            if (!document.getElementById("ranking-preview")) return;
            loadRankingPreview();
          }, 800);
        })
        .subscribe();

      window.__pageCleanup = () => {
        clearTimeout(noticeRefetchTimer);
        clearTimeout(rankingRefetchTimer);
        supabase.removeChannel(noticeChannel);
        supabase.removeChannel(rankingChannel);
      };
    })();
  })();
  </script>
</body>
</html>
