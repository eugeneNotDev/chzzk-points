<body>
  <script>
    if (localStorage.getItem("chzzk_points_sidebar_collapsed") === "1") {
      document.body.classList.add("sidebar-collapsed");
    }
  </script>
  <div class="app-shell">

        </button>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></span>
          <span class="label">홈</span>
        </a>
        <a href="notice.html">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M8 9h8"/><path d="M8 13h8"/><path d="M8 17h4"/></svg></span>
          <span class="label">공지사항</span>
        </a>
        <a href="ranking.html">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 5H4v2a4 4 0 0 0 4 4"/><path d="M16 5h4v2a4 4 0 0 1-4 4"/><path d="M12 13v3"/><path d="M9 20h6"/><path d="M10 20v-2h4v2"/></svg></span>
          <span class="label">랭킹</span>
        </a>
        <a href="shop.html">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></span>
          <span class="label">포인트 상점</span>
        </a>
        <a href="attendance.html">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg></span>
          <span class="label">출석체크</span>

        <a href="mypage.html">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg></span>
          <span class="label">마이페이지</span>

        <a href="admin.html" id="admin-nav-link" class="active" hidden>
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l7 4v6c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6l7-4z"/></svg></span>
          <span class="label">관리자</span>
        </a>

    <main class="main-content">
      <h1>관리자</h1>

      <div id="admin-forbidden" class="card" hidden>
        <p>관리자 계정으로 로그인해야 볼 수 있는 페이지예요.</p>
        <button onclick="spaNavigate('index.html')">홈으로</button>
      </div>

      <div id="admin-content" hidden>
        <div class="admin-tabs">
          <button type="button" class="admin-tab-btn active" data-tab="users">유저 관리</button>
          <button type="button" class="admin-tab-btn" data-tab="log">포인트 로그</button>
        </div>

        <div id="admin-tab-users" class="admin-tab-panel">
          <div class="card">
            <div class="card-header">
              <h2>유저 검색</h2>
            </div>
            <div class="admin-search-row">
              <input type="text" id="admin-search-input" placeholder="채널명으로 검색 (비워두면 최근 가입자 순으로 표시)">
              <button type="button" id="admin-search-btn">검색</button>
            </div>
            <p id="admin-search-status" class="status-msg"></p>
          </div>

          <div class="card">
            <div id="admin-user-list"></div>
            <p id="admin-user-empty" class="empty-state" hidden>검색 결과가 없어요.</p>
          </div>
        </div>

        <div id="admin-tab-log" class="admin-tab-panel" hidden>
          <div class="card">
            <div class="card-header">
              <h2>포인트 로그</h2>
            </div>
            <p class="muted">포인트 지급/차감/상점 사용 기록을 최신순으로 보여줘요. 오버레이 알림을 놓쳤을 때 여기서 대조할 수 있어요.</p>
            <div class="admin-search-row">
              <input type="text" id="log-search-input" placeholder="채널명으로 검색 (비워두면 전체 최신순)">
              <button type="button" id="log-search-btn">검색</button>
            </div>
            <p id="log-search-status" class="status-msg"></p>
          </div>

          <div class="card">
            <div id="points-log-list"></div>
            <p id="points-log-empty" class="empty-state" hidden>기록이 없어요.</p>
            <div id="points-log-pagination" class="pagination"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/chzzk-auth.js?v=8"></script>
  <script src="assets/js/spa-router.js?v=5"></script>
  <script>
  // 다른 페이지들과 같은 이유로 IIFE로 감싼다 (라우터가 페이지 이동마다 이 스크립트를 다시 실행함).
  (function () {
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    const searchInput = document.getElementById("admin-search-input");
    const searchBtn = document.getElementById("admin-search-btn");
    const searchStatus = document.getElementById("admin-search-status");
    const listEl = document.getElementById("admin-user-list");
    const emptyEl = document.getElementById("admin-user-empty");

    function renderUserRow(u) {
      return `
        <div class="admin-user-row${u.banned ? " is-banned" : ""}" data-channel-id="${escapeHtml(u.channelId)}">
          <div class="admin-user-info">
            <strong>${escapeHtml(u.channelName || "(이름 없음)")}</strong>
            <span class="muted">${u.balance.toLocaleString("ko-KR")}P · ${u.isPublic ? "공개" : "비공개"}${u.banned ? " · 밴됨" : ""}</span>
          </div>
          <div class="admin-user-actions">
            <input type="number" class="admin-amount-input" placeholder="수량" min="1">
            <button type="button" class="secondary admin-give-btn">지급</button>
            <button type="button" class="secondary admin-take-btn">차감</button>
            <button type="button" class="secondary admin-ban-btn${u.banned ? " is-banned" : ""}">${u.banned ? "밴 해제" : "밴"}</button>
          </div>
        </div>`;
    }

    function wireUserRowButtons() {
      document.querySelectorAll(".admin-user-row").forEach((row) => {
        const channelId = row.dataset.channelId;
        const amountInput = row.querySelector(".admin-amount-input");
        row.querySelector(".admin-give-btn").addEventListener("click", () => adjustPoints(channelId, amountInput, 1));
        row.querySelector(".admin-take-btn").addEventListener("click", () => adjustPoints(channelId, amountInput, -1));
        row.querySelector(".admin-ban-btn").addEventListener("click", () =>
          toggleBan(channelId, row.classList.contains("is-banned")),
        );
      });
    }

    async function searchUsers(q) {
      searchStatus.textContent = "검색 중...";
      searchStatus.className = "status-msg";
      try {
        const res = await authFetch(ADMIN_URL, {
          method: "POST",
          body: JSON.stringify({ action: "search-users", q }),
        });
        if (!res.ok) throw new Error(String(res.status));
        const data = await res.json();
        searchStatus.textContent = "";
        if (!data.users || data.users.length === 0) {
          listEl.innerHTML = "";
          emptyEl.hidden = false;
          return;
        }
        emptyEl.hidden = true;
        listEl.innerHTML = data.users.map(renderUserRow).join("");
        wireUserRowButtons();
      } catch (err) {
        searchStatus.textContent = "검색에 실패했어요.";
        searchStatus.classList.add("error");
      }
    }

    // amountInput에 입력한 수량 * sign(+1이면 지급, -1이면 차감)만큼 포인트를 조정.
    async function adjustPoints(channelId, amountInput, sign) {
      const raw = Number(amountInput.value);
      if (!Number.isFinite(raw) || raw <= 0) {
        alert("지급/차감할 수량을 1 이상 숫자로 입력해주세요.");
        return;
      }
      const amount = Math.trunc(raw) * sign;
      try {
        const res = await authFetch(ADMIN_URL, {
          method: "POST",
          body: JSON.stringify({ action: "adjust-points", channelId, amount }),
        });
        if (!res.ok) throw new Error(String(res.status));
        amountInput.value = "";
        await searchUsers(searchInput.value);
      } catch (err) {
        alert("포인트 지급/차감에 실패했어요.");
      }
    }

    // 밴: 로그인 자체를 막고(oauth-callback) 랭킹에서도 뺀다(public.ranking 뷰).
    async function toggleBan(channelId, currentlyBanned) {
      const next = !currentlyBanned;
      const confirmMsg = next
        ? "이 유저를 밴할까요? (재로그인이 막히고 랭킹에서도 빠져요)"
        : "밴을 해제할까요?";
      if (!confirm(confirmMsg)) return;
      try {
        const res = await authFetch(ADMIN_URL, {
          method: "POST",
          body: JSON.stringify({ action: "set-ban", channelId, banned: next }),
        });
        if (!res.ok) throw new Error(String(res.status));
        await searchUsers(searchInput.value);
      } catch (err) {
        alert("밴 처리에 실패했어요.");
      }
    }

    searchBtn.addEventListener("click", () => searchUsers(searchInput.value));
    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") searchUsers(searchInput.value);
    });

    // 포인트 로그 탭 ---------------------------------------------------------
    const logSearchInput = document.getElementById("log-search-input");
    const logSearchBtn = document.getElementById("log-search-btn");
    const logSearchStatus = document.getElementById("log-search-status");
    const logListEl = document.getElementById("points-log-list");
    const logEmptyEl = document.getElementById("points-log-empty");
    const logPaginationEl = document.getElementById("points-log-pagination");
    let pointsLogLoaded = false;
    let logCurrentPage = 1;

    function formatDateTime(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleString("ko-KR", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    function renderLogRow(entry) {
      const positive = entry.amount > 0;
      const sign = positive ? "+" : "";
      return `
        <div class="points-log-row">
          <div class="points-log-who">
            <strong>${escapeHtml(entry.channelName || "(알 수 없음)")}</strong>
            <span class="points-log-reason">${escapeHtml(entry.reason || "")}</span>
          </div>
          <div class="points-log-amount ${positive ? "positive" : "negative"}">${sign}${entry.amount.toLocaleString("ko-KR")}P</div>
          <div class="points-log-time">${formatDateTime(entry.createdAt)}</div>
        </div>`;
    }

    // 페이지 번호 버튼을 그린다 — 현재 페이지 기준 앞뒤 2개씩 + 처음/끝 페이지, 나머지는 "…"로 생략.
    // admin.html/mypage.html 둘 다 똑같이 쓰는 로직이라 살짝 중복이지만, 페이지 하나 분량이라
    // 별도 공용 JS 파일로 뺄 만큼은 아니라고 판단.
    function renderPagination(container, page, totalPages, onGoToPage) {
      if (totalPages <= 1) {
        container.innerHTML = "";
        return;
      }
      const pageSet = new Set([1, totalPages]);
      for (let p = page - 2; p <= page + 2; p++) {
        if (p >= 1 && p <= totalPages) pageSet.add(p);
      }
      const sorted = [...pageSet].sort((a, b) => a - b);

      let html = `<button type="button" class="page-btn" data-page="${page - 1}" ${page <= 1 ? "disabled" : ""}>이전</button>`;
      let prev = 0;
      for (const p of sorted) {
        if (prev && p - prev > 1) html += `<span class="page-ellipsis">…</span>`;
        html += `<button type="button" class="page-btn${p === page ? " active" : ""}" data-page="${p}">${p}</button>`;
        prev = p;
      }
      html += `<button type="button" class="page-btn" data-page="${page + 1}" ${page >= totalPages ? "disabled" : ""}>다음</button>`;
      container.innerHTML = html;
      container.querySelectorAll(".page-btn:not(:disabled)").forEach((btn) => {
        btn.addEventListener("click", () => onGoToPage(Number(btn.dataset.page)));
      });
    }

    async function loadPointsLog(q, page) {
      logCurrentPage = page ?? 1;
      logSearchStatus.textContent = "불러오는 중...";
      logSearchStatus.className = "status-msg";
      try {
        const res = await authFetch(ADMIN_URL, {
          method: "POST",
          body: JSON.stringify({ action: "list-points-log", q, page: logCurrentPage }),
        });
        if (!res.ok) throw new Error(String(res.status));
        const data = await res.json();
        logSearchStatus.textContent = "";
        if (!data.entries || data.entries.length === 0) {
          logListEl.innerHTML = "";
          logEmptyEl.hidden = false;
          logPaginationEl.innerHTML = "";
          return;
        }
        logEmptyEl.hidden = true;
        logListEl.innerHTML = data.entries.map(renderLogRow).join("");
        renderPagination(logPaginationEl, data.page, data.totalPages, (p) => loadPointsLog(logSearchInput.value, p));
      } catch (err) {
        logSearchStatus.textContent = "불러오기에 실패했어요.";
        logSearchStatus.classList.add("error");
      }
    }

    logSearchBtn.addEventListener("click", () => loadPointsLog(logSearchInput.value, 1));
    logSearchInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") loadPointsLog(logSearchInput.value, 1);
    });

    // 탭 전환 ----------------------------------------------------------------
    const tabBtns = document.querySelectorAll(".admin-tab-btn");
    const tabPanels = {
      users: document.getElementById("admin-tab-users"),
      log: document.getElementById("admin-tab-log"),
    };
    tabBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        const tab = btn.dataset.tab;
        tabBtns.forEach((b) => b.classList.toggle("active", b === btn));
        Object.entries(tabPanels).forEach(([key, panel]) => { panel.hidden = key !== tab; });
        if (tab === "log" && !pointsLogLoaded) {
          pointsLogLoaded = true;
          loadPointsLog("", 1);
        }
      });
    });

    renderSidebarUser();
    initSidebarToggle();
    initAdminNav();
    verifySessionInBackground();

    if (!isAdmin()) {
      document.getElementById("admin-forbidden").hidden = false;
    } else {
      document.getElementById("admin-content").hidden = false;
      searchUsers("");
    }
  })();
  </script>
</body>
</html>
