  <script>
  // 다른 페이지들과 같은 이유로 IIFE로 감쌈 (라우터가 페이지 이동마다 이 스크립트를 다시 실행함).
  (function () {
    let supabase;
    const NOTICE_LIMIT = 50;

    // 첨부파일 — 서버(notices/index.ts)의 화이트리스트와 같은 목록을 클라이언트에도 둠
    // (여기선 순전히 UX용 조기 피드백이고, 진짜 검증은 서버가 확장자 기준으로 다시 함).
    const MAX_ATTACHMENTS = 10;
    const NOTICE_IMAGE_EXTENSIONS = new Set(["jpg", "jpeg", "png", "gif", "webp"]);
    const NOTICE_FILE_EXTENSIONS = new Set(["pdf", "doc", "docx", "xls", "xlsx", "ppt", "pptx", "hwp", "hwpx", "zip", "txt", "csv"]);
    // "파일" 피커는 문서뿐 아니라 이미지도 받음 — 사진 피커로 올리면 갤러리용(리사이즈/압축 O),
    // 파일 피커로 올리면 원본 그대로 다운로드 전용(kind:"file")으로 취급함.
    const NOTICE_FILE_PICKER_EXTENSIONS = new Set([...NOTICE_IMAGE_EXTENSIONS, ...NOTICE_FILE_EXTENSIONS]);
    const MAX_IMAGE_LONG_EDGE = 1600;
    const IMAGE_JPEG_QUALITY = 0.85;

    // id(문자열) -> 공지 원본. 목록/모달을 다시 그릴 때 서버 재조회 없이 사용.
    let noticesById = new Map();
    // 글쓰기/수정 모달의 첨부파일 상태 — pendingFiles는 이번에 새로 고른(아직 업로드 안 한)
    // { file: File, kind: "image"|"file" } 객체들(kind는 어느 피커로 골랐는지 — 확장자가 아니라
    // 이걸로 갤러리행/다운로드행이 갈림), keptAttachments는 수정 모드에서 기존 첨부파일 중
    // 지우지 않고 유지하기로 한 것들(notice_attachments 행, snake_case). 제출 시점에
    // pendingFiles를 업로드하고 keptAttachments와 합쳐서 최종 attachments로 보냄.
    let pendingFiles = [];
    let keptAttachments = [];

    // "새 글" 표시 기준 시각 — 이 페이지가 실행되자마자(= 이번 방문에서 loadNotices()가 아직
    // markNoticesSeen()을 부르기 전) 딱 한 번만 읽어서 고정해둠. loadNotices()는 글쓰기/수정/삭제
    // 직후나 실시간 갱신 때마다 다시 불릴 수 있는데, 그때마다 새로 읽으면 markNoticesSeen()이 이미
    // "방금"으로 갱신해놔서 새 글 표시가 매번 사라져버림 — 그래서 이번 페이지 방문(라우터가 이
    // 스크립트를 다시 실행하는 시점) 기준으로 한 번 고정. 페이지를 벗어났다가 다시 들어오면
    // 스크립트가 다시 실행되면서 새로 고정됨(그땐 직전 방문에서 이미 "확인함" 처리됐으니 정상).
    const noticeListSeenBaseline = getNoticeLastSeenAt();
    // 지금 모달이 어떤 모드인지: null(닫힘) | "view" | "edit" | "create"
    let modalMode = null;
    let modalNoticeId = null;

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function autoResizeTextarea(el) {
      el.style.height = "auto";
      el.style.height = `${el.scrollHeight}px`;
    }

    // --- 첨부파일 (글쓰기/수정 공통) ---------------------------------------------
    function extensionOfClient(fileName) {
      const dot = fileName.lastIndexOf(".");
      return dot === -1 ? "" : fileName.slice(dot + 1).toLowerCase();
    }

    function totalAttachmentCount() {
      return pendingFiles.length + keptAttachments.length;
    }

    // 기존 첨부파일(storage_path 있음, snake_case)이든 새로 업로드한 것(path 있음, camelCase)이든
    // notices Edge Function이 기대하는 형식({path, fileName, mimeType, sizeBytes, kind})으로 맞춰줌.
    function toApiAttachment(a) {
      if (a.storage_path) {
        return { path: a.storage_path, fileName: a.file_name, mimeType: a.mime_type, sizeBytes: a.size_bytes, kind: a.kind };
      }
      return { path: a.path, fileName: a.fileName, mimeType: a.mimeType, sizeBytes: a.sizeBytes, kind: a.kind };
    }

    // 이미지가 너무 크면(긴 변 1600px 초과, 또는 1.5MB 초과) 캔버스로 줄이고 JPEG로 압축함 —
    // gif는 리사이즈하면 애니메이션이 깨지니 그대로 둠. 이미 충분히 작으면 원본 그대로 씀.
    async function maybeCompressImage(file) {
      if (extensionOfClient(file.name) === "gif") return file;
      const bitmap = await createImageBitmap(file).catch(() => null);
      if (!bitmap) return file;
      const longEdge = Math.max(bitmap.width, bitmap.height);
      if (longEdge <= MAX_IMAGE_LONG_EDGE && file.size <= 1.5 * 1024 * 1024) {
        if (bitmap.close) bitmap.close();
        return file;
      }
      const scale = Math.min(1, MAX_IMAGE_LONG_EDGE / longEdge);
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(bitmap.width * scale));
      canvas.height = Math.max(1, Math.round(bitmap.height * scale));
      canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      if (bitmap.close) bitmap.close();
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", IMAGE_JPEG_QUALITY));
      if (!blob) return file;
      const newName = file.name.replace(/\.[^.]+$/, "") + ".jpg";
      return new File([blob], newName, { type: "image/jpeg" });
    }

    const NOTICE_ADD_TILE_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>`;

    // 사진 그리드(정사각형 썸네일)와 파일 목록(아이콘+이름+용량 행)을 각각 따로 그림 — 네이버카페처럼
    // 첨부 종류별로 영역을 나눈 것. kept(수정 모드에서 유지 중인 기존 첨부)와 pending(이번에 새로
    // 고른 파일)을 kind로 나눠서 그리되, splice로 지울 때 쓰는 인덱스는 원래 배열(keptAttachments/
    // pendingFiles) 기준을 그대로 씀 — 그려지는 순서와 원본 배열 인덱스가 달라져도 상관없게.
    function renderAttachmentPreview() {
      const photoGrid = document.getElementById("notice-photo-grid");
      const fileList = document.getElementById("notice-file-picker-list");
      const countLabel = document.getElementById("notice-attachment-count-label");
      const atLimit = totalAttachmentCount() >= MAX_ATTACHMENTS;

      const keptPhotoTiles = keptAttachments.map((a, i) => ({ a, i })).filter(({ a }) => a.kind === "image").map(({ a, i }) => `
        <div class="notice-photo-tile">
          <img src="${noticeAttachmentUrl(a.storage_path)}" alt="">
          <button type="button" class="notice-attachment-remove-btn" data-kept-index="${i}" aria-label="제거">×</button>
        </div>`).join("");
      // pending은 확장자가 아니라 p.kind(어느 피커로 골랐는지)로 나눔 — 이미지를 "파일" 피커로
      // 올렸으면 확장자는 이미지라도 다운로드 목록 쪽에 그려야 함.
      const pendingPhotoTiles = pendingFiles.map((p, i) => ({ p, i })).filter(({ p }) => p.kind === "image").map(({ p, i }) => `
        <div class="notice-photo-tile">
          <img src="${URL.createObjectURL(p.file)}" alt="">
          <button type="button" class="notice-attachment-remove-btn" data-pending-index="${i}" aria-label="제거">×</button>
        </div>`).join("");
      const addPhotoTile = atLimit ? "" : `
        <label class="notice-photo-add-tile" for="notice-image-input">
          ${NOTICE_ADD_TILE_ICON_SVG}
          <span>사진 추가</span>
        </label>`;
      photoGrid.innerHTML = keptPhotoTiles + pendingPhotoTiles + addPhotoTile;

      const keptFileRows = keptAttachments.map((a, i) => ({ a, i })).filter(({ a }) => a.kind !== "image").map(({ a, i }) => `
        <div class="notice-file-picker-row">
          ${NOTICE_FILE_ICON_SVG}
          <span class="notice-file-picker-name">${escapeHtml(a.file_name)}</span>
          <span class="notice-file-picker-size">${formatNoticeFileSize(a.size_bytes)}</span>
          <button type="button" class="notice-attachment-remove-btn" data-kept-index="${i}" aria-label="제거">×</button>
        </div>`).join("");
      const pendingFileRows = pendingFiles.map((p, i) => ({ p, i })).filter(({ p }) => p.kind !== "image").map(({ p, i }) => `
        <div class="notice-file-picker-row">
          ${NOTICE_FILE_ICON_SVG}
          <span class="notice-file-picker-name">${escapeHtml(p.file.name)}</span>
          <span class="notice-file-picker-size">${formatNoticeFileSize(p.file.size)}</span>
          <button type="button" class="notice-attachment-remove-btn" data-pending-index="${i}" aria-label="제거">×</button>
        </div>`).join("");
      const addFileRow = atLimit ? "" : `
        <label class="notice-file-add-btn" for="notice-file-input">
          ${NOTICE_ADD_TILE_ICON_SVG}
          <span>파일 추가</span>
        </label>`;
      fileList.innerHTML = keptFileRows + pendingFileRows + addFileRow;

      countLabel.textContent = `${totalAttachmentCount()}/${MAX_ATTACHMENTS}`;

      document.querySelectorAll(".notice-attachment-remove-btn[data-kept-index]").forEach((btn) => {
        btn.addEventListener("click", () => {
          keptAttachments.splice(Number(btn.dataset.keptIndex), 1);
          renderAttachmentPreview();
        });
      });
      document.querySelectorAll(".notice-attachment-remove-btn[data-pending-index]").forEach((btn) => {
        btn.addEventListener("click", () => {
          pendingFiles.splice(Number(btn.dataset.pendingIndex), 1);
          renderAttachmentPreview();
        });
      });
    }

    // pendingFiles를 실제로 업로드함: 1) "사진" 피커로 고른 것만 리사이즈/압축(파일 피커로 고른
    // 이미지는 다운로드 원본 보존을 위해 그대로 둠) 2) get-upload-urls로 signed URL을 받음(이때
    // 의도한 kind도 같이 보내서 서버가 그 kind 기준으로 용량 한도를 적용하게 함) 3) Storage에
    // 직접 업로드(anon 키 — signed URL 자체가 권한이라 RLS와 무관) 4) 업로드된 파일들을
    // attachments API 형식(camelCase)으로 돌려줌.
    async function uploadPendingFiles() {
      if (pendingFiles.length === 0) return [];
      const preparedFiles = await Promise.all(pendingFiles.map(async (p) => {
        const file = p.kind === "image" ? await maybeCompressImage(p.file) : p.file;
        return { file, kind: p.kind };
      }));

      const res = await authFetch(NOTICES_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "get-upload-urls",
          files: preparedFiles.map((p) => ({ fileName: p.file.name, sizeBytes: p.file.size, kind: p.kind })),
        }),
      });
      if (!res.ok) throw new Error("upload_urls_failed");
      const { uploads } = await res.json();

      const results = [];
      for (let i = 0; i < uploads.length; i++) {
        const u = uploads[i];
        const file = preparedFiles[i].file;
        const { error } = await supabase.storage.from(NOTICE_ATTACHMENTS_BUCKET).uploadToSignedUrl(u.path, u.token, file, {
          contentType: file.type || "application/octet-stream",
        });
        if (error) {
          console.error("[notice] Storage 업로드 실패", u.path, error);
          throw new Error("upload_failed");
        }
        results.push({ path: u.path, fileName: u.fileName, mimeType: file.type || "application/octet-stream", sizeBytes: file.size, kind: u.kind });
      }
      return results;
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleString("ko-KR");
    }

    // 목록 한 줄 — 제목만 보이는 게시판 스타일. 제목을 누르면 모달로 내용이 뜸.
    function renderNoticeRow(n) {
      const idStr = String(n.id);
      const editedLabel = n.updated_at && n.updated_at !== n.created_at ? " (수정됨)" : "";
      const isNew = !!noticeListSeenBaseline && new Date(n.created_at) > new Date(noticeListSeenBaseline);
      const newTag = isNew ? `<span class="notice-new-tag">NEW</span>` : "";
      const actions = isAdmin()
        ? `
          <span class="notice-item-actions">
            <button type="button" class="link-btn notice-edit-btn" data-id="${idStr}">수정</button>
            <button type="button" class="link-btn notice-delete-btn" data-id="${idStr}">삭제</button>
          </span>`
        : "";
      return `
        <li class="notice-item" data-id="${idStr}">
          <button type="button" class="notice-title-btn" data-id="${idStr}">${newTag}${escapeHtml(n.title || "(제목 없음)")}</button>
          <div class="notice-item-footer">
            <time>${formatDate(n.created_at)}${editedLabel}</time>
            ${actions}
          </div>
        </li>`;
    }

    function renderNoticeList() {
      const listEl = document.getElementById("notice-list");
      listEl.innerHTML = Array.from(noticesById.values()).map((n) => renderNoticeRow(n)).join("");
      wireNoticeRowButtons();
    }

    function wireNoticeRowButtons() {
      document.querySelectorAll(".notice-title-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          openViewModal(btn.dataset.id);
          // noticeListSeenBaseline은 이번 페이지 방문 동안 고정이라(위 주석 참고) 팝업을
          // 열었다 닫아도 NEW 표시가 자동으로는 안 사라짐 — 그래서 실제로 클릭해서 읽은
          // 이 글의 NEW만 화면에서 바로 지워줌(localStorage 기준 시각 자체는 안 건드림,
          // 어차피 loadNotices() 시점에 markNoticesSeen()으로 이미 갱신돼 있음).
          const tag = btn.querySelector(".notice-new-tag");
          if (tag) tag.remove();
        });
      });
      document.querySelectorAll(".notice-edit-btn").forEach((btn) => {
        btn.addEventListener("click", () => openEditModal(btn.dataset.id));
      });
      document.querySelectorAll(".notice-delete-btn").forEach((btn) => {
        btn.addEventListener("click", () => deleteNotice(btn.dataset.id));
      });
    }

    async function loadNotices() {
      const listEl = document.getElementById("notice-list");
      const emptyEl = document.getElementById("notice-empty");
      const { data, error } = await supabase
        .from("notices")
        .select("id, title, content, created_at, updated_at, notice_attachments(id, kind, file_name, storage_path, mime_type, size_bytes, sort_order)")
        .order("created_at", { ascending: false })
        .order("sort_order", { referencedTable: "notice_attachments", ascending: true })
        .limit(NOTICE_LIMIT);

      if (error) {
        console.error("[notice] 공지 조회 실패", error);
        emptyEl.textContent = "공지사항을 불러오지 못했어요.";
        emptyEl.hidden = false;
        listEl.innerHTML = "";
        return;
      }
      // 목록을 정상적으로 불러왔으면(비어있어도) 여기까지 다 본 걸로 쳐서 사이드바 알림 점을
      // 끔 — 조회 자체가 실패했을 땐(위 error 분기) 안 함, 못 봤는데 본 걸로 칠 순 없으니.
      markNoticesSeen();
      if (!data || data.length === 0) {
        noticesById = new Map();
        emptyEl.hidden = false;
        listEl.innerHTML = "";
        return;
      }
      emptyEl.hidden = true;
      noticesById = new Map(data.map((n) => [String(n.id), n]));
      renderNoticeList();
    }

    function openViewModal(id) {
      const n = noticesById.get(id);
      if (!n) return;
      modalMode = "view";
      modalNoticeId = id;
      const editedLabel = n.updated_at && n.updated_at !== n.created_at ? " (수정됨)" : "";
      document.getElementById("notice-modal-title").textContent = n.title || "(제목 없음)";
      document.getElementById("notice-modal-meta").textContent = formatDate(n.created_at) + editedLabel;
      document.getElementById("notice-modal-content").textContent = n.content;

      const sortedAttachments = (n.notice_attachments || []).slice().sort((a, b) => a.sort_order - b.sort_order);
      const { galleryHtml, fileListHtml } = renderNoticeAttachmentsHtml(sortedAttachments);
      const galleryEl = document.getElementById("notice-modal-gallery");
      const filesEl = document.getElementById("notice-modal-files");
      galleryEl.innerHTML = galleryHtml;
      galleryEl.hidden = galleryHtml.length === 0;
      filesEl.innerHTML = fileListHtml;
      filesEl.hidden = fileListHtml.length === 0;
      // 이미지가 있는 글이면 팝업을 넓혀서 네이버카페 본문처럼 크게 보여줌(style.css .has-images).
      document.getElementById("notice-modal").classList.toggle("has-images", galleryHtml.length > 0);

      document.getElementById("notice-modal-admin-actions").hidden = !isAdmin();
      document.getElementById("notice-modal-view").hidden = false;
      document.getElementById("notice-modal-form").hidden = true;
      showModal();
    }

    function openEditModal(id) {
      const n = noticesById.get(id);
      if (!n) return;
      modalMode = "edit";
      modalNoticeId = id;
      pendingFiles = [];
      keptAttachments = (n.notice_attachments || []).slice().sort((a, b) => a.sort_order - b.sort_order);
      fillForm(n.title, n.content, "저장");
      showModal();
    }

    function openCreateModal() {
      modalMode = "create";
      modalNoticeId = null;
      pendingFiles = [];
      keptAttachments = [];
      fillForm("", "", "등록");
      showModal();
    }

    function fillForm(title, content, submitLabel) {
      document.getElementById("notice-modal-title-input").value = title;
      const contentInput = document.getElementById("notice-modal-content-input");
      contentInput.value = content;
      document.getElementById("notice-modal-submit-btn").textContent = submitLabel;
      const statusEl = document.getElementById("notice-modal-status");
      statusEl.textContent = "";
      statusEl.className = "status-msg";
      document.getElementById("notice-image-input").value = "";
      document.getElementById("notice-file-input").value = "";
      renderAttachmentPreview();
      // 글쓰기/수정 폼은 원래 폭으로(보기 모드에서 넓혀놨던 걸 되돌림).
      document.getElementById("notice-modal").classList.remove("has-images");
      document.getElementById("notice-modal-view").hidden = true;
      document.getElementById("notice-modal-form").hidden = false;
      // dialog가 화면에 붙은(open) 다음이라야 scrollHeight 계산이 정확해서, showModal 이후에도 한 번 더 맞춰줌.
      requestAnimationFrame(() => autoResizeTextarea(contentInput));
    }

    function showModal() {
      const dialog = document.getElementById("notice-modal");
      if (!dialog.open) dialog.showModal();
    }

    function closeModal() {
      const dialog = document.getElementById("notice-modal");
      if (dialog.open) dialog.close();
      modalMode = null;
      modalNoticeId = null;
    }

    async function deleteNotice(id) {
      if (!confirm("이 공지를 삭제할까요?")) return;
      try {
        const res = await authFetch(`${NOTICES_URL}?id=${encodeURIComponent(id)}`, { method: "DELETE" });
        if (!res.ok) throw new Error(String(res.status));
        if (modalNoticeId === id) closeModal();
        await loadNotices();
      } catch (err) {
        alert("삭제에 실패했어요.");
      }
    }

    function setupModal() {
      const dialog = document.getElementById("notice-modal");
      const contentInput = document.getElementById("notice-modal-content-input");

      document.getElementById("notice-write-btn").addEventListener("click", openCreateModal);
      document.getElementById("notice-modal-close-btn").addEventListener("click", closeModal);
      document.getElementById("notice-modal-edit-btn").addEventListener("click", () => openEditModal(modalNoticeId));
      document.getElementById("notice-modal-delete-btn").addEventListener("click", () => deleteNotice(modalNoticeId));
      document.getElementById("notice-modal-cancel-btn").addEventListener("click", () => {
        // 기존 글을 고치다가 취소했으면 보기 화면으로, 새 글 작성 중 취소했으면 그냥 닫음.
        if (modalMode === "edit" && modalNoticeId) {
          openViewModal(modalNoticeId);
        } else {
          closeModal();
        }
      });
      contentInput.addEventListener("input", () => autoResizeTextarea(contentInput));

      // 사진/파일 두 input을 따로 받되, 처리 로직(개수 제한·확장자 검증·pendingFiles에 담기)은
      // 공통이라 헬퍼 하나로 묶음 — allowedExt는 각 그룹의 화이트리스트, kind는 어느 피커로
      // 골랐는지(= 갤러리로 보여줄지, 다운로드 전용으로만 둘지)를 그대로 기록함. "파일" 피커는
      // 이미지도 받지만(allowedExt에 이미지 확장자 포함) kind는 항상 "file"로 고정 — 그래야
      // 리사이즈도 안 하고 렌더링도 다운로드 목록 쪽으로 감.
      function handleAttachmentPick(files, allowedExt, kind) {
        const statusEl = document.getElementById("notice-modal-status");
        for (const file of files) {
          if (totalAttachmentCount() >= MAX_ATTACHMENTS) {
            statusEl.textContent = `첨부파일은 최대 ${MAX_ATTACHMENTS}개까지예요.`;
            statusEl.className = "status-msg error";
            break;
          }
          const ext = extensionOfClient(file.name);
          if (!allowedExt.has(ext)) {
            statusEl.textContent = `지원하지 않는 파일 형식이에요: ${file.name}`;
            statusEl.className = "status-msg error";
            continue;
          }
          pendingFiles.push({ file, kind });
        }
        renderAttachmentPreview();
      }

      document.getElementById("notice-image-input").addEventListener("change", (e) => {
        const files = Array.from(e.target.files || []);
        e.target.value = ""; // 같은 파일을 다시 선택할 수 있게 비움
        handleAttachmentPick(files, NOTICE_IMAGE_EXTENSIONS, "image");
      });
      document.getElementById("notice-file-input").addEventListener("change", (e) => {
        const files = Array.from(e.target.files || []);
        e.target.value = "";
        handleAttachmentPick(files, NOTICE_FILE_PICKER_EXTENSIONS, "file");
      });

      // 배경(backdrop) 클릭 시 닫기 — dialog 엘리먼트 자체를 클릭한 경우만(안쪽 내용 클릭은 버블링 안 됨).
      dialog.addEventListener("click", (e) => {
        if (e.target === dialog) closeModal();
      });
      // Esc로 닫힐 때도 상태 초기화.
      dialog.addEventListener("close", () => {
        modalMode = null;
        modalNoticeId = null;
      });

      document.getElementById("notice-modal-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const titleInput = document.getElementById("notice-modal-title-input");
        const statusEl = document.getElementById("notice-modal-status");
        const title = titleInput.value.trim();
        const content = contentInput.value.trim();
        if (!title || !content) {
          statusEl.textContent = "제목과 내용을 모두 입력해주세요.";
          statusEl.className = "status-msg error";
          return;
        }
        const submitBtn = document.getElementById("notice-modal-submit-btn");
        submitBtn.disabled = true;
        statusEl.textContent = "";
        statusEl.className = "status-msg";
        try {
          let uploadedAttachments = [];
          if (pendingFiles.length > 0) {
            statusEl.textContent = "첨부파일 업로드 중...";
            uploadedAttachments = await uploadPendingFiles();
          }
          const attachments = [...keptAttachments.map(toApiAttachment), ...uploadedAttachments.map(toApiAttachment)];

          const isEdit = modalMode === "edit";
          statusEl.textContent = isEdit ? "저장 중..." : "등록 중...";
          const url = isEdit ? `${NOTICES_URL}?id=${encodeURIComponent(modalNoticeId)}` : NOTICES_URL;
          const res = await authFetch(url, {
            method: isEdit ? "PATCH" : "POST",
            body: JSON.stringify({ title, content, attachments }),
          });
          if (!res.ok) throw new Error(String(res.status));
          closeModal();
          await loadNotices();
        } catch (err) {
          // 원인을 콘솔에 남겨둠 — 화면엔 단순 메시지만 뜨니, 문제 생기면 F12 콘솔에서 바로 확인 가능하게.
          console.error("[notice] 등록/수정 실패", err);
          const base = modalMode === "edit" ? "저장에 실패했어요." : "등록에 실패했어요.";
          const isUploadError = err && (err.message === "upload_failed" || err.message === "upload_urls_failed");
          statusEl.textContent = isUploadError ? `${base} (첨부파일 업로드 오류)` : base;
          statusEl.className = "status-msg error";
        } finally {
          submitBtn.disabled = false;
        }
      });
    }

    (async () => {
      ({ supabase } = await import("./assets/js/supabase-client.js"));
      renderSidebarUser();
      initSidebarToggle();
      initAdminNav();
      initShopNavGroup();
      initNoticeBadge();
      verifySessionInBackground();
      setupModal();

      document.getElementById("notice-write-btn").hidden = !isAdmin();

      await loadNotices();

      // 메인 페이지 미리보기에서 특정 글로 바로 들어온 경우(notice.html?id=5) 해당 글 모달이 자동으로 열림.
      const targetId = new URLSearchParams(location.search).get("id");
      if (targetId && noticesById.has(targetId)) {
        openViewModal(targetId);
      }

      // 실시간 갱신: 다른 브라우저(관리자 등)에서 공지를 쓰거나 고치거나 지우면 새로고침 없이
      // 목록에 바로 반영함. notices 테이블은 이미 공개 읽기 정책이 있어서 바로 구독 가능
      // (0019_admin_features.sql에서 realtime publication에만 추가함).
      let refetchTimer = null;
      const channel = supabase
        .channel("notices_page")
        .on("postgres_changes", { event: "*", schema: "public", table: "notices" }, () => {
          clearTimeout(refetchTimer);
          refetchTimer = setTimeout(() => {
            if (!document.getElementById("notice-list")) return; // 이미 다른 페이지로 이동함
            loadNotices();
          }, 500);
        })
        .subscribe();

      window.__pageCleanup = () => {
        clearTimeout(refetchTimer);
        supabase.removeChannel(channel);
      };
    })();
  })();
  </script>
