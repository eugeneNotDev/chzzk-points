<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>방송 보러 가기 · 유진 팬보드</title>
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("chzzk_points_theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="stylesheet" href="assets/css/style.css?v=127">
</head>
<body class="open-live-page">
  <!-- 방송 알림을 눌렀을 때 오는 중간 페이지(sw.js). 알림에서 바로 치지직 주소를 열면 앱이 아니라 웹(크롬)으로 열려서,
       여기서 안드로이드는 치지직 앱을 직접 지정해서 엶(앱이 없으면 웹으로). 자동으로 안 열리면 버튼을 누르면 됨. -->
  <main class="open-live">
    <img src="assets/img/app-icon-192.png" alt="" class="open-live-icon">
    <h1>유진 방송 시작!</h1>
    <p class="muted" id="open-live-msg">치지직 앱을 여는 중이에요…</p>
    <a class="button open-live-btn" id="open-live-app">치지직 앱으로 보기</a>
    <a class="open-live-sub" id="open-live-web">웹으로 보기</a>
    <a class="open-live-sub" href="index.html">팬보드로 가기</a>
  </main>
  <script>
    (function () {
      var CHANNEL = "37a1acfaa35d56311bf428dc96142e9f";
      var web = "https://chzzk.naver.com/live/" + CHANNEL;
      var isAndroid = /Android/i.test(navigator.userAgent);
      // 안드로이드: 치지직 앱(패키지 com.navercorp.game.android.community)으로 같은 방송 주소를 엶. 앱이 없으면 웹 주소로.
      var intent = "intent://chzzk.naver.com/live/" + CHANNEL +
        "#Intent;scheme=https;package=com.navercorp.game.android.community;S.browser_fallback_url=" + encodeURIComponent(web) + ";end";
      var appLink = document.getElementById("open-live-app");
      appLink.href = isAndroid ? intent : web;
      document.getElementById("open-live-web").href = web;
      if (isAndroid) {
        location.href = intent;
        setTimeout(function () {
          document.getElementById("open-live-msg").textContent = "앱이 안 열리면 아래 버튼을 눌러 주세요.";
        }, 1500);
      } else {
        document.getElementById("open-live-msg").textContent = "아래 버튼을 누르면 방송으로 가요.";
      }
    })();
  </script>
</body>
</html>
