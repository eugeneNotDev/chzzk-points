  <script>
  // 다른 페이지들과 같은 이유로 IIFE로 감쌈 (라우터가 페이지 이동마다 이 스크립트를 다시 실행함).
  //
  // 가로 릴 룰렛: 결과는 서버(roulette 함수 → DB의 roulette_spin)가 정하고, 화면은 받은 결과 카드가
  // 가운데 선에 멈추도록 옆으로 굴리는 연출만 함. 결과가 나오고 2초 뒤에 다시 돌릴 수 있음.
  (function () {
    const MIN_BET = 100;
    const TILE_W = 88;
    const TILE_GAP = 8;
    const STEP = TILE_W + TILE_GAP;
    const SPIN_MS = matchMedia("(prefers-reduced-motion: reduce)").matches ? 1200 : 5200;
    const AFTER_RESULT_WAIT_MS = 2000;
    // 서버(roulette_spin)는 한 번 돌리고 5초 안에는 다시 못 돌리게 막음 — 화면 대기도 그보다 짧아지지 않게
    // 맞춤(움직임 줄이기 설정이면 연출이 짧아서 2초만 기다리면 서버 쿨타임에 걸렸음).
    const SERVER_COOLDOWN_MS = 5000;
    const MAX_BET = 400000000; // 서버가 받는 최대(기술적 한계, 실제로 닿을 일 없음)
    // 배율별 카드 색. 목록에 없는 배율이 테이블에 추가되면 5배 이상은 금색, 나머지는 회색.
    const MULT_COLORS = { 0: "#e03141", 0.5: "#ff922b", 1: "#6b7480", 1.2: "#2fb574", 1.5: "#00a8e8", 2: "#8b5cf6", 3: "#ff6bb5", 5: "#f2c230" };
    // 결과 말고 지나가는 카드들은 보기 좋게 섞기만 하는 용도(실제 확률 아님 — 실제 확률은 서버에만 있음).
    const FILLER_WEIGHTS = { 0: 10, 0.5: 14, 1: 26, 1.2: 14, 1.5: 12, 2: 9, 3: 7, 5: 5 };

    let state = null;          // GET 응답
    let multipliers = [0, 0.5, 1, 1.2, 1.5, 2, 3, 5];
    let tiles = [];            // 지금 릴에 깔린 배율들
    let centerIdx = 0;         // 가운데 선에 있는 카드 번호
    let centerJitter = 0;
    let spinning = false;
    let waitUntil = 0;         // 이 시각 전까지는 다시 못 돌림(결과 후 2초 / 서버 쿨타임)
    const timers = [];
    // 다른 페이지로 넘어가면 true — 요청/타이머가 끝난 뒤 이미 떠난 페이지(또는 다시 들어온 새 페이지)를
    // 건드리지 않게 막음.
    let disposed = false;

    const fmt = (n) => Number(n).toLocaleString("ko-KR");
    const multLabel = (m) => `x${Number(m)}`;
    const colorOf = (m) => MULT_COLORS[m] || (m >= 5 ? "#f2c230" : "#6b7480");
    const $ = (id) => document.getElementById(id);
    function later(fn, ms) { const t = setTimeout(() => { if (!disposed) fn(); }, ms); timers.push(t); return t; }

    function fillerPick() {
      const pool = multipliers.map((m) => [m, FILLER_WEIGHTS[m] ?? 8]);
      let r = Math.random() * pool.reduce((s, [, w]) => s + w, 0);
      for (const [m, w] of pool) { r -= w; if (r < 0) return m; }
      return pool[pool.length - 1][0];
    }
    function tileHtml(m) {
      return `<div class="roulette-tile${m >= 5 ? " is-jackpot" : ""}" style="--c:${colorOf(m)}"><b>${multLabel(m)}</b></div>`;
    }
    function placeStrip(idx, jitter, animate) {
      const strip = $("roulette-strip"), view = $("roulette-view");
      if (!strip || !view) return;
      const x = view.clientWidth / 2 - (idx * STEP + TILE_W / 2) + jitter;
      strip.style.transition = animate ? `transform ${SPIN_MS}ms cubic-bezier(.08,.6,.1,1)` : "none";
      strip.style.transform = `translateX(${x}px)`;
    }
    function renderTiles() { $("roulette-strip").innerHTML = tiles.map(tileHtml).join(""); }
    function buildIdleStrip() {
      tiles = Array.from({ length: 15 }, fillerPick);
      centerIdx = 7;
      centerJitter = 0;
      renderTiles();
      placeStrip(centerIdx, 0, false);
    }

    // ── 걸 포인트 입력 ──
    function betValue() { return parseInt(String($("roulette-bet-input").value).replace(/[^0-9]/g, ""), 10) || 0; }
    function setBet(v) { $("roulette-bet-input").value = v > 0 ? fmt(v) : ""; validate(); }
    function balance() { return state ? state.balance : 0; }

    function validate() {
      const hint = $("game-hint"), btn = $("roulette-spin-btn"), input = $("roulette-bet-input");
      if (!hint || !btn) return false;
      // 관리자가 미니게임을 막은 계정은 걸 포인트 입력과 빠른 버튼도 못 건드리게.
      const locked = !!(state && state.blocked);
      input.disabled = locked;
      document.querySelectorAll(".game-chip").forEach((c) => { c.disabled = locked; });
      const v = betValue();
      let msg = `최소 ${fmt(MIN_BET)}P부터 걸 수 있어요`;
      let bad = false;
      if (state && state.blocked) { bad = true; msg = "미니게임 참여가 제한된 계정이에요"; }
      else if (!state || !state.eligible) { bad = true; msg = `${state?.requiredTierName || "브론즈"} 등급부터 돌릴 수 있어요`; }
      else if (balance() < MIN_BET) { bad = true; msg = `${fmt(MIN_BET)}P 이상 있어야 돌릴 수 있어요`; }
      else if (v < MIN_BET) { bad = true; msg = `${fmt(MIN_BET)}P 이상 걸어야 해요`; }
      else if (v > balance()) { bad = true; msg = "보유 포인트보다 많이 걸 수 없어요"; }
      else if (v > MAX_BET) { bad = true; msg = `한 번에 ${fmt(MAX_BET)}P까지 걸 수 있어요`; }
      hint.textContent = msg;
      hint.classList.toggle("is-bad", bad && !!state && state.eligible);
      input.classList.toggle("is-bad", bad && !!state && state.eligible && v > 0);
      const waiting = Date.now() < waitUntil;
      btn.disabled = bad || spinning || waiting;
      if (!spinning && !waiting) btn.textContent = "돌리기";
      return !bad;
    }

    function renderBalance() {
      $("game-balance").textContent = fmt(balance());
    }
    function syncGlobalBalance(v) {
      // 모바일 상단바/더보기 시트의 포인트 표시도 같이 갱신(chzzk-auth.js가 캐시값을 씀).
      try { localStorage.setItem(BALANCE_CACHE_KEY, String(v)); } catch {}
      if (typeof renderMobileUser === "function") renderMobileUser();
    }

    function renderLock() {
      const lock = $("game-lock");
      if (state.eligible) { lock.hidden = true; return; }
      const barWrap = $("game-lock-bar").parentElement;
      if (state.blocked) {
        // 관리자가 미니게임 참여를 막은 계정(0053_minigame_block.sql).
        $("game-lock-title").textContent = "미니게임 참여가 제한됐어요";
        const until = state.blockedUntil
          ? `${new Date(state.blockedUntil).toLocaleString("ko-KR", { year: "numeric", month: "long", day: "numeric", hour: "2-digit", minute: "2-digit" })}까지`
          : "별도 해제 전까지";
        $("game-lock-desc").textContent = `${until} 룰렛·가위바위보·홀짝에 참여할 수 없어요.\n무료 뽑기와 투표는 그대로 할 수 있어요.`;
        barWrap.hidden = true;
        lock.hidden = false;
        return;
      }
      barWrap.hidden = false;
      const need = state.requiredPoints, have = state.maxBalanceReached;
      $("game-lock-title").textContent = `${state.requiredTierName || "브론즈"} 등급부터 참여할 수 있어요`;
      $("game-lock-desc").textContent = `최고 보유 포인트 기준이에요. 지금 ${fmt(have)}P · ${fmt(Math.max(0, need - have))}P 더 모으면 열려요.`;
      $("game-lock-bar").style.width = `${Math.min(100, need > 0 ? (have / need) * 100 : 100)}%`;
      lock.hidden = false;
    }

    function timeLabel(iso) {
      return new Intl.DateTimeFormat("ko-KR", { timeZone: "Asia/Seoul", year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date(iso));
    }
    function recentItemHtml(r) {
      const net = r.payout - r.bet;
      const cls = net > 0 ? "is-plus" : net < 0 ? "is-minus" : "is-even";
      const sign = net > 0 ? "+" : net === 0 ? "±" : "";
      return `<li>
        <span class="game-recent-mult" style="--c:${colorOf(r.multiplier)}">${multLabel(r.multiplier)}</span>
        <span class="game-recent-bet">${fmt(r.bet)}P</span>
        <span class="game-recent-time muted">${timeLabel(r.createdAt)}</span>
        <span class="game-recent-net ${cls}">${sign}${fmt(net)}P</span>
      </li>`;
    }
    function renderRecent() {
      const el = $("game-recent");
      el.innerHTML = state.recent.length
        ? state.recent.map(recentItemHtml).join("")
        : `<li class="game-recent-empty muted">아직 돌린 기록이 없어요.</li>`;
    }

    function showResult(res, bet) {
      const el = $("game-result");
      const cls = res.net > 0 ? "is-plus" : res.net < 0 ? "is-minus" : "is-even";
      const sign = res.net > 0 ? "+" : res.net === 0 ? "±" : "";
      el.className = `game-result ${cls}${res.multiplier >= 5 ? " is-jackpot" : ""}`;
      el.style.setProperty("--c", colorOf(res.multiplier));
      el.innerHTML = `<strong>${multLabel(res.multiplier)} · ${sign}${fmt(res.net)}P</strong><span class="muted">${fmt(bet)}P 걸어서 ${fmt(res.payout)}P 받았어요</span>`;
      el.hidden = false;
    }
    function showError(msg) {
      const el = $("game-result");
      el.className = "game-result is-error";
      el.style.removeProperty("--c");
      el.innerHTML = `<span>${msg}</span>`;
      el.hidden = false;
    }

    function startWait(ms) {
      waitUntil = Date.now() + ms;
      const btn = $("roulette-spin-btn");
      if (btn) { btn.disabled = true; btn.textContent = "잠시만요…"; }
      later(() => validate(), ms + 30);
    }

    async function spin() {
      if (spinning || Date.now() < waitUntil || !validate()) return;
      const bet = betValue();
      const requestedAt = Date.now();
      spinning = true;
      const btn = $("roulette-spin-btn");
      btn.disabled = true;
      btn.textContent = "돌아가는 중…";
      $("game-result").hidden = true;

      let res, data;
      try {
        res = await authFetch(ROULETTE_URL, { method: "POST", body: JSON.stringify({ bet }) });
        data = await res.json().catch(() => ({}));
      } catch (err) {
        console.error("[roulette] 요청 실패", err);
        data = { error: "network" };
        res = { ok: false };
      }
      if (disposed || !$("roulette-strip")) return; // 그 사이 다른 페이지로 이동함
      if (!res.ok) {
        spinning = false;
        if (data.error === "cooldown") {
          showError(`너무 빨라요. ${data.retryAfterSeconds || 1}초 뒤에 다시 돌려주세요.`);
          startWait((data.retryAfterSeconds || 1) * 1000);
        } else if (data.error === "insufficient_balance") {
          showError("포인트가 부족해요.");
          await reloadStateSafely();
        } else if (data.error === "tier_required") {
          showError(`${state?.requiredTierName || "브론즈"} 등급부터 할 수 있어요.`);
          await reloadStateSafely();
        } else if (res.status === 401) {
          showLoggedOut();
          return;
        } else if (data.error === "minigame_blocked") {
          showError("미니게임 참여가 제한된 계정이에요.");
          await reloadStateSafely();
        } else if (data.error === "invalid_bet") {
          showError(`${fmt(MIN_BET)}P 이상 걸어야 해요.`);
        } else if (data.error !== "banned" && res.status !== 401) {
          showError("룰렛을 돌리지 못했어요. 다시 시도해주세요.");
        }
        validate();
        return;
      }

      // 지금 보이는 카드들을 앞에 그대로 두고 뒤에 새 카드를 이어 붙인 뒤, 결과 카드까지 굴림
      // (처음부터 새로 깔면 돌리는 순간 화면이 휙 바뀌어서 어색함).
      const keepFrom = Math.max(0, centerIdx - 5);
      const kept = tiles.slice(keepFrom, centerIdx + 6);
      const startIdx = centerIdx - keepFrom;
      const targetIdx = startIdx + 40 + Math.floor(Math.random() * 6);
      tiles = kept.slice();
      while (tiles.length < targetIdx + 6) tiles.push(fillerPick());
      tiles[targetIdx] = data.multiplier;
      renderTiles();
      placeStrip(startIdx, centerJitter, false);
      void $("roulette-strip").offsetWidth;
      const jitter = Math.round((Math.random() - 0.5) * (TILE_W - 20));
      placeStrip(targetIdx, jitter, true);
      centerIdx = targetIdx;
      centerJitter = jitter;

      later(() => {
        const strip = $("roulette-strip");
        if (!strip) return;
        strip.children[targetIdx]?.classList.add("is-hit");
        state.balance = data.balance;
        if (data.balance > state.maxBalanceReached) state.maxBalanceReached = data.balance;
        state.recent.unshift({ bet, multiplier: data.multiplier, payout: data.payout, createdAt: new Date().toISOString() });
        state.recent = state.recent.slice(0, 10);
        renderBalance();
        renderRecent();
        syncGlobalBalance(data.balance);
        showResult(data, bet);
        spinning = false;
        if (betValue() > balance()) setBet(Math.max(MIN_BET, Math.min(betValue(), balance())));
        startWait(Math.max(AFTER_RESULT_WAIT_MS, SERVER_COOLDOWN_MS + 300 - (Date.now() - requestedAt)));
      }, SPIN_MS + 80);
    }

    // 에러 후 상태를 다시 받아올 때 — 이것까지 실패해도(네트워크 등) 버튼이 잠긴 채로 남지 않게 항상 다시 검사함.
    async function reloadStateSafely() {
      try { await loadState(); } catch (err) { console.error("[minigame] 상태 다시 조회 실패", err); }
      finally { if (!disposed) validate(); }
    }
    // 게임 중에 세션이 만료돼서 로그아웃된 경우(authFetch가 로그아웃 처리) — 로그인 안내 화면으로 바꿈.
    function showLoggedOut() {
      $("logged-in").hidden = true;
      $("logged-out").hidden = false;
    }

    async function loadState() {
      const res = await authFetch(ROULETTE_URL);
      if (!res.ok) return false;
      state = await res.json();
      if (!Array.isArray(state.recent)) state.recent = [];
      if (Array.isArray(state.multipliers) && state.multipliers.length) multipliers = state.multipliers;
      renderBalance();
      renderLock();
      renderRecent();
      syncGlobalBalance(state.balance);
      if (state.cooldownSeconds > 0) startWait(state.cooldownSeconds * 1000);
      validate();
      return true;
    }

    $("roulette-bet-input").addEventListener("input", () => { const v = betValue(); $("roulette-bet-input").value = v ? fmt(v) : ""; validate(); });
    document.querySelectorAll(".game-chip").forEach((chip) => chip.addEventListener("click", () => {
      let v = betValue();
      if (chip.dataset.add) v += Number(chip.dataset.add);
      else if (chip.dataset.set === "half") v = Math.max(MIN_BET, Math.floor(balance() / 2));
      else if (chip.dataset.set === "max") v = Math.max(MIN_BET, balance());
      else v = MIN_BET;
      setBet(v);
    }));
    $("roulette-spin-btn").addEventListener("click", spin);
    $("roulette-bet-input").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); spin(); } });

    const onResize = () => { if (!spinning) placeStrip(centerIdx, centerJitter, false); };
    window.addEventListener("resize", onResize);
    window.__pageCleanup = () => {
      disposed = true;
      window.removeEventListener("resize", onResize);
      timers.forEach(clearTimeout);
    };

    renderSidebarUser();
    initSidebarToggle();
    initAdminNav();
    initShopNavGroup();
    initNoticeBadge();

    (async () => {
      if (!isLoggedIn()) {
        $("loading-state").hidden = true;
        $("logged-out").hidden = false;
        return;
      }
      const ok = await loadState().catch((err) => { console.error("[roulette] 상태 조회 실패", err); return false; });
      $("loading-state").hidden = true;
      if (!ok) {
        $("logged-out").hidden = false;
        return;
      }
      $("logged-in").hidden = false;
      buildIdleStrip();
      validate();
    })();
  })();
  </script>
</body>
</html>
