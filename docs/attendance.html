  })();

  <script>
  // 다른 페이지들과 같은 이유로 IIFE로 감쌈 (라우터가 페이지 이동마다 이 스크립트를 다시 실행함).
  (function () {
    // 오늘(KST) 날짜 — 서버(attendance-check/index.ts의 kstDateString)와 같은 방식(Intl +
    // 타임존 명시)으로 구해야 "오늘" 판정이 서버와 어긋나지 않음.
    function kstDateString(date) {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Seoul",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
      }).format(date);
    }

    let todayYear, todayMonth, todayStr;
    let viewYear, viewMonth;
    // "오늘" 기준 출석 상태 — 어느 달을 보고 있든(달력 넘기기와 무관하게) 항상 오늘 기준으로
    // 유지함. 조회 중인 달이 이번 달일 때만 서버 응답으로 최신화(다른 달 조회 응답에는
    // checkedToday/isLive이 그 달 기준이 아니라서 그대로 쓰면 안 됨 — 항상 "오늘"에 대한 값이어야 함).
    // attendanceCount/bonusEvery/pointsPerCheck/bonusPoints/milestoneEvery/milestonePoints: 누적 출석 횟수, 보너스 주기, 1회 포인트,
    // 보너스 포인트, 100회 달성 보너스 주기·포인트 — 전부 서버가 내려줌(금액은 attendance-check 함수의 상수 하나만 고치면 화면도 따라감).
    // checkedToday는 방송 중이면 "이번 방송에 출석했는지"(서버가 방송 시작일 기준으로 판정).
    let todayStatus = { isLive: false, checkedToday: false, balance: 0, attendanceCount: 0, bonusEvery: 10, pointsPerCheck: 100, bonusPoints: 100, milestoneEvery: 100, milestonePoints: 1000 };

    function statusFromResponse(data) {
      return {
        isLive: data.isLive,
        checkedToday: data.checkedToday,
        balance: data.balance,
        attendanceCount: data.attendanceCount ?? 0,
        bonusEvery: data.bonusEvery ?? 10,
        pointsPerCheck: data.pointsPerCheck ?? 100,
        bonusPoints: data.bonusPoints ?? 100,
        milestoneEvery: data.milestoneEvery ?? 100,
        milestonePoints: data.milestonePoints ?? 1000,
      };
    }

    function computeToday() {
      todayStr = kstDateString(new Date());
      const [y, m] = todayStr.split("-").map(Number);
      todayYear = y;
      todayMonth = m;
    }

    function renderCalendar(year, month, attendedDates) {
      document.getElementById("month-label").textContent = `${year}년 ${month}월`;
      const gridEl = document.getElementById("attendance-grid");
      const attendedSet = new Set(attendedDates);

      const firstWeekday = new Date(Date.UTC(year, month - 1, 1)).getUTCDay();
      const daysInMonth = new Date(Date.UTC(year, month, 0)).getUTCDate();

      let html = "";
      for (let i = 0; i < firstWeekday; i++) {
        html += `<span class="attendance-day is-empty"></span>`;
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const classes = ["attendance-day"];
        if (dateStr === todayStr) classes.push("is-today");
        if (attendedSet.has(dateStr)) classes.push("is-attended");
        html += `<span class="${classes.join(" ")}">${day}</span>`;
      }
      gridEl.innerHTML = html;
    }

    function renderStatus() {
      const badgeEl = document.getElementById("live-status-badge");
      const textEl = document.getElementById("live-status-text");
      const btnEl = document.getElementById("checkin-btn");

      if (todayStatus.isLive) {
        badgeEl.className = "status-badge live";
        textEl.textContent = "방송 중";
      } else {
        badgeEl.className = "status-badge offline";
        textEl.textContent = "방송 종료";
      }

      const every = todayStatus.bonusEvery || 10;
      const count = todayStatus.attendanceCount || 0;
      const mEvery = todayStatus.milestoneEvery || 100;
      const base = todayStatus.pointsPerCheck;
      const bonus = todayStatus.bonusPoints;
      const milestone = todayStatus.milestonePoints;
      // 다음 출석에 붙는 보너스 합계(10번째 보너스 + 100번째 달성 보너스).
      const nextBonus = ((count + 1) % every === 0 ? bonus : 0) + ((count + 1) % mEvery === 0 ? milestone : 0);
      const nextIsBonus = nextBonus > 0;
      const fmtP = (n) => `${Number(n).toLocaleString("ko-KR")}P`;

      if (todayStatus.checkedToday) {
        btnEl.textContent = todayStatus.isLive ? "이번 방송 출석 완료" : "오늘 출석 완료";
        btnEl.disabled = true;
      } else if (!todayStatus.isLive) {
        btnEl.textContent = "방송 중에만 출석체크 할 수 있어요";
        btnEl.disabled = true;
      } else {
        btnEl.textContent = nextIsBonus ? `출석체크 (+${fmtP(base + nextBonus)}, ${count + 1}번째 보너스!)` : `출석체크 (+${fmtP(base)})`;
        btnEl.disabled = false;
      }

      // 누적 출석/다음 보너스까지 남은 횟수 안내.
      const progressEl = document.getElementById("attendance-progress");
      const left = every - (count % every);
      const mLeft = mEvery - (count % mEvery);
      progressEl.innerHTML = `누적 출석 <strong>${count.toLocaleString("ko-KR")}회</strong> · `
        + (left === 1 && !todayStatus.checkedToday
          ? `다음 출석은 보너스 +${fmtP(nextBonus)}!`
          : `${every}번째 출석마다 보너스 +${fmtP(bonus)} (다음 보너스까지 ${left}회)`)
        + `<br>${mEvery}번째 출석마다 달성 보너스 +${fmtP(milestone)} (다음 달성까지 ${mLeft}회)`;
      progressEl.hidden = false;
    }

    // year/month 달의 출석 현황을 받아옴. 실패(로그아웃/밴 등)면 null — 호출부에서
    // authFetch가 이미 401/403 처리(로그아웃 등)를 했으니 여기선 화면 전환만 신경쓰면 됨.
    async function fetchMonth(year, month) {
      const res = await authFetch(`${ATTENDANCE_CHECK_URL}?year=${year}&month=${month}`);
      if (!res.ok) return null;
      return res.json();
    }

    async function goToMonth(year, month) {
      viewYear = year;
      viewMonth = month;
      const data = await fetchMonth(year, month);
      if (!data) {
        document.getElementById("loading-state").hidden = true;
        document.getElementById("logged-out").hidden = false;
        document.getElementById("logged-in").hidden = true;
        return;
      }
      renderCalendar(year, month, data.attendedDates);
      // 조회한 달이 "오늘"이 속한 달일 때만 오늘 기준 상태를 이 응답으로 최신화함
      // (다른 달을 보고 있을 땐 그 응답의 checkedToday/isLive는 그 달 기준이 아니라서 무시).
      if (year === todayYear && month === todayMonth) {
        todayStatus = statusFromResponse(data);
        renderStatus();
      }
    }

    document.getElementById("prev-month-btn").addEventListener("click", () => {
      const m = viewMonth === 1 ? 12 : viewMonth - 1;
      const y = viewMonth === 1 ? viewYear - 1 : viewYear;
      goToMonth(y, m);
    });
    document.getElementById("next-month-btn").addEventListener("click", () => {
      const m = viewMonth === 12 ? 1 : viewMonth + 1;
      const y = viewMonth === 12 ? viewYear + 1 : viewYear;
      goToMonth(y, m);
    });

    document.getElementById("checkin-btn").addEventListener("click", async () => {
      const btnEl = document.getElementById("checkin-btn");
      const statusEl = document.getElementById("checkin-status");
      btnEl.disabled = true;
      statusEl.textContent = "";
      statusEl.className = "status-msg";
      try {
        const res = await authFetch(ATTENDANCE_CHECK_URL, { method: "POST", body: JSON.stringify({}) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          if (data.error === "not_live") {
            statusEl.textContent = "지금은 방송 중이 아니에요.";
            statusEl.classList.add("error");
            todayStatus.isLive = false;
          } else if (data.error === "already_checked") {
            statusEl.textContent = "이번 방송은 이미 출석체크했어요.";
            statusEl.classList.add("error");
            todayStatus.checkedToday = true;
          } else if (data.error !== "banned") {
            statusEl.textContent = "출석체크에 실패했어요. 다시 시도해주세요.";
            statusEl.classList.add("error");
          }
          renderStatus();
          return;
        }
        todayStatus = statusFromResponse(data);
        statusEl.textContent = data.bonus > 0
          ? `출석체크 완료! ${data.attendanceCount}번째 출석 보너스까지 +${Number(data.pointsEarned ?? 200).toLocaleString("ko-KR")}P 지급됐어요.`
          : `출석체크 완료! +${Number(data.pointsEarned ?? 100).toLocaleString("ko-KR")}P 지급됐어요.`;
        statusEl.classList.add("ok");
        if (viewYear === todayYear && viewMonth === todayMonth) {
          renderCalendar(viewYear, viewMonth, data.attendedDates);
        }
        renderStatus();
      } catch (err) {
        console.error("[attendance] 출석체크 실패", err);
        statusEl.textContent = "출석체크에 실패했어요. 다시 시도해주세요.";
        statusEl.classList.add("error");
        btnEl.disabled = false;
      }
    });

    // 방송 코드 입력 ----------------------------------------------------------
    const STREAM_CODE_URL = `${FUNCTIONS_BASE_URL}/stream-code`;
    const CODE_ERRORS = {
      invalid_code: "없는 코드예요. 다시 확인해 주세요.",
      expired: "이미 끝난 코드예요.",
      sold_out: "아쉽지만 선착순 인원이 다 찼어요.",
      already_redeemed: "이미 받은 코드예요.",
      too_many_attempts: "틀린 코드를 너무 많이 입력했어요. 잠시 후 다시 시도해 주세요.",
    };
    // 서버가 보내준 문서({ title, body, foot })를 창으로 띄움. 내용은 글자 그대로(textContent) 넣음.
    function openCodeDoc(doc) {
      let dlg = document.getElementById("code-doc");
      if (!dlg) {
        dlg = document.createElement("dialog");
        dlg.id = "code-doc";
        dlg.className = "code-doc";
        dlg.innerHTML = `<div class="code-doc-bar"><i></i><i></i><i></i><span class="code-doc-title"></span>
          <button type="button" class="code-doc-close" aria-label="닫기">×</button></div>
          <pre class="code-doc-body"></pre><div class="code-doc-foot"></div>`;
        dlg.querySelector(".code-doc-close").addEventListener("click", () => dlg.close());
        dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
        document.body.appendChild(dlg);
      }
      dlg.querySelector(".code-doc-title").textContent = String(doc.title || "");
      dlg.querySelector(".code-doc-body").textContent = String(doc.body || "");
      dlg.querySelector(".code-doc-foot").textContent = String(doc.foot || "");
      if (!dlg.open) dlg.showModal();
    }

    document.getElementById("code-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const inputEl = document.getElementById("code-input");
      const btnEl = document.getElementById("code-submit");
      const resultEl = document.getElementById("code-result");
      const code = inputEl.value.trim();
      resultEl.className = "code-result";
      resultEl.textContent = "";
      if (!code) {
        resultEl.classList.add("error");
        resultEl.textContent = "코드를 입력해 주세요.";
        return;
      }
      btnEl.disabled = true;
      try {
        const res = await authFetch(STREAM_CODE_URL, { method: "POST", body: JSON.stringify({ code }) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          if (res.status === 401 || res.status === 403) return;
          resultEl.classList.add("error");
          resultEl.textContent = CODE_ERRORS[data.error] || "코드 입력에 실패했어요. 다시 시도해 주세요.";
          return;
        }
        if (data.doc) {
          // 코드 대신 문서가 온 경우(stream-code 함수 참고) — 문서 창으로 보여줌.
          inputEl.value = "";
          openCodeDoc(data.doc);
          return;
        }
        const fmt = (n) => Number(n).toLocaleString("ko-KR");
        const rankText = data.maxUses ? `선착순 ${fmt(data.maxUses)}명 중 ${fmt(data.rank)}번째` : `${fmt(data.rank)}번째로 받았어요`;
        resultEl.classList.add("ok");
        resultEl.innerHTML = `<strong>+${fmt(data.points)}P</strong><span>받았어요! ${rankText}</span>`;
        inputEl.value = "";
        if (typeof data.balance === "number") {
          todayStatus.balance = data.balance;
          // 모바일 상단바/더보기 시트의 포인트 표시도 같이 갱신(chzzk-auth.js가 캐시값을 씀).
          try { localStorage.setItem(BALANCE_CACHE_KEY, String(data.balance)); } catch {}
          if (typeof renderMobileUser === "function") renderMobileUser();
        }
      } catch (err) {
        console.error("[attendance] 방송 코드 입력 실패", err);
        resultEl.classList.add("error");
        resultEl.textContent = "코드 입력에 실패했어요. 다시 시도해 주세요.";
      } finally {
        btnEl.disabled = false;
      }
    });

    renderSidebarUser();
    initSidebarToggle();
    initAdminNav();
    initShopNavGroup();
    initNoticeBadge();

    (async () => {
      if (!isLoggedIn()) {
        document.getElementById("loading-state").hidden = true;
        document.getElementById("logged-out").hidden = false;
        return;
      }
      computeToday();
      const data = await fetchMonth(todayYear, todayMonth);
      const loadingEl = document.getElementById("loading-state");
      if (!data) {
        loadingEl.hidden = true;
        document.getElementById("logged-out").hidden = false;
        return;
      }
      loadingEl.hidden = true;
      document.getElementById("logged-in").hidden = false;
      viewYear = todayYear;
      viewMonth = todayMonth;
      todayStatus = statusFromResponse(data);
      renderCalendar(viewYear, viewMonth, data.attendedDates);
      renderStatus();
    })();
  })();
  </script>
</body>
</html>
