  <script src="assets/js/chzzk-auth.js?v=17"></script>
  <script src="assets/js/spa-router.js?v=7"></script>
  <script>
  // spa-router.js가 페이지 이동마다 이 스크립트를 다시 실행하므로 IIFE로 감쌈.
  (function () {
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // m:ss 형식으로 남은 시간을 표시. 음수(이미 지남)는 호출부에서 걸러서 여기까지 안 옴.
    function formatCountdown(ms) {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return `${m}:${String(s).padStart(2, "0")}`;
    }

    // --- 참여자 화면 (관리자 포함 로그인한 모두) --------------------------------
    let currentPrediction = null;
    let selectedOptionId = null;
    let lastPredictionId = null;

    // 정산/취소된 투표는 새 투표가 시작되기 전까지 계속 화면에 남는데, 너무 오래 그대로
    // 두면 관리자가 방치한 것처럼 보이니 10분 지나면 참여자 화면만 "진행 중인 투표가
    // 없습니다" 최초 상태로 되돌림(백엔드/데이터는 안 건드리고 화면 표시만 처리).
    const PREDICT_EXPIRE_DISPLAY_MS = 10 * 60 * 1000;
    function isExpiredForDisplay(p) {
      if (!p) return false;
      const endedAt = p.status === "resolved" ? p.resolvedAt : p.status === "cancelled" ? p.cancelledAt : null;
      if (!endedAt) return false;
      return Date.now() - new Date(endedAt).getTime() >= PREDICT_EXPIRE_DISPLAY_MS;
    }

    async function loadPrediction() {
      try {
        const res = await authFetch(PREDICTIONS_URL);
        if (!res.ok) throw new Error(String(res.status));
        const data = await res.json();
        currentPrediction = data.prediction;
        renderPrediction();
      } catch (err) {
        console.error("[predict] 투표 조회 실패", err);
      }
    }

    function updateBetSubmitState() {
      const btn = document.getElementById("predict-bet-submit-btn");
      if (btn) btn.disabled = selectedOptionId == null;
    }

    function renderPrediction() {
      const emptyEl = document.getElementById("predict-empty");
      const contentEl = document.getElementById("predict-content");
      const headingEl = document.getElementById("predict-user-heading");

      if (!currentPrediction || isExpiredForDisplay(currentPrediction)) {
        emptyEl.hidden = false;
        contentEl.hidden = true;
        headingEl.textContent = "진행 중인 투표";
        lastPredictionId = null;
        return;
      }

      // 새 투표로 바뀌었으면(이전 투표가 정산/취소되고 새로 생성된 경우 등) 이전 선택은 의미가
      // 없으니 초기화 — 그 외(같은 투표를 다시 그리는 폴링/카운트다운)에는 선택을 그대로 유지함.
      if (currentPrediction.id !== lastPredictionId) {
        selectedOptionId = null;
        lastPredictionId = currentPrediction.id;
      }

      emptyEl.hidden = true;
      contentEl.hidden = false;

      const p = currentPrediction;
      document.getElementById("predict-title").textContent = p.title;

      const closesAt = new Date(p.closesAt).getTime();
      const now = Date.now();
      const isOpenAndActive = p.status === "open" && closesAt > now;
      const isClosedAwaitingResolve = p.status === "open" && closesAt <= now;

      if (p.status === "cancelled") headingEl.textContent = "취소된 투표";
      else if (p.status === "resolved") headingEl.textContent = "종료된 투표";
      else if (isClosedAwaitingResolve) headingEl.textContent = "마감된 투표";
      else headingEl.textContent = "진행 중인 투표";

      const countdownEl = document.getElementById("predict-countdown");
      if (isOpenAndActive) {
        countdownEl.hidden = false;
        countdownEl.textContent = `마감까지 ${formatCountdown(closesAt - now)}`;
        countdownEl.classList.toggle("is-urgent", closesAt - now < 30000);
      } else if (isClosedAwaitingResolve) {
        countdownEl.hidden = false;
        countdownEl.classList.remove("is-urgent");
        countdownEl.textContent = "마감! 정산을 기다리는 중이에요.";
      } else {
        countdownEl.hidden = true;
      }

      const bannerEl = document.getElementById("predict-status-banner");
      bannerEl.hidden = true;
      bannerEl.className = "predict-status-banner";
      if (p.status === "cancelled") {
        bannerEl.hidden = false;
        bannerEl.textContent = p.myBet ? "취소된 투표예요. 베팅하신 포인트는 전액 환불됐어요." : "취소된 투표예요.";
      } else if (p.status === "resolved") {
        bannerEl.hidden = false;
        if (p.myBet) {
          const won = p.myBet.optionId === p.winningOptionId;
          bannerEl.classList.add(won ? "win" : "lose");
          bannerEl.textContent = won
            ? `적중! +${(p.myBet.payout ?? 0).toLocaleString("ko-KR")}P 받았어요.`
            : "아쉽게 빗나갔어요. 다음 기회에!";
        } else {
          bannerEl.textContent = "정산이 끝난 투표예요.";
        }
      }

      const selectable = isOpenAndActive && !p.myBet;
      document.getElementById("predict-option-list").innerHTML = p.options.map((opt) => {
        const isMine = p.myBet && p.myBet.optionId === opt.id;
        const isWinner = p.status === "resolved" && p.winningOptionId === opt.id;
        const isLoser = p.status === "resolved" && p.winningOptionId != null && !isWinner;
        const classes = ["predict-option"];
        if (isMine || selectedOptionId === opt.id) classes.push("selected");
        if (isWinner) classes.push("is-winner");
        if (isLoser) classes.push("is-loser");
        if (!selectable) classes.push("disabled");
        return `
          <div class="${classes.join(" ")}" data-option-id="${opt.id}">
            <div class="predict-option-bar" style="width:${opt.percent.toFixed(1)}%"></div>
            <div class="predict-option-content">
              <span class="predict-option-label">${escapeHtml(opt.label)}${isMine ? '<span class="my-pick-badge">내 선택</span>' : ""}</span>
              <span class="predict-option-stats">
                <span class="predict-option-percent">${opt.percent.toFixed(1)}%</span>
                <span class="predict-option-multiplier">${opt.multiplier > 0 ? opt.multiplier.toFixed(2) + "배" : "-"}</span>
              </span>
            </div>
          </div>`;
      }).join("");

      if (selectable) {
        document.querySelectorAll("#predict-option-list .predict-option").forEach((el) => {
          el.addEventListener("click", () => {
            selectedOptionId = Number(el.dataset.optionId);
            document.querySelectorAll("#predict-option-list .predict-option").forEach((o) => {
              o.classList.toggle("selected", Number(o.dataset.optionId) === selectedOptionId);
            });
            updateBetSubmitState();
          });
        });
      }

      const betFormEl = document.getElementById("predict-bet-form");
      const myBetNoteEl = document.getElementById("predict-my-bet-note");
      if (p.myBet) {
        betFormEl.hidden = true;
        myBetNoteEl.hidden = false;
        const optLabel = p.options.find((o) => o.id === p.myBet.optionId)?.label ?? "";
        myBetNoteEl.textContent = `"${optLabel}"에 ${p.myBet.amount.toLocaleString("ko-KR")}P 베팅했어요.`;
      } else if (isOpenAndActive) {
        betFormEl.hidden = false;
        myBetNoteEl.hidden = true;
      } else {
        betFormEl.hidden = true;
        myBetNoteEl.hidden = true;
      }
      updateBetSubmitState();
    }

    // 숫자만 입력되게 필터링 — type="number"는 브라우저 스피너가 뜨고 e/+/-/.도 입력되니
    // type="text"로 바꾸고 여기서 직접 걸러냄.
    document.getElementById("predict-bet-amount").addEventListener("input", (e) => {
      const filtered = e.target.value.replace(/[^0-9]/g, "");
      if (filtered !== e.target.value) e.target.value = filtered;
    });

    document.getElementById("predict-bet-submit-btn").addEventListener("click", async () => {
      if (!currentPrediction || selectedOptionId == null) return;
      const amountInput = document.getElementById("predict-bet-amount");
      const amount = Math.trunc(Number(amountInput.value));
      const statusEl = document.getElementById("predict-status-msg");
      if (!Number.isFinite(amount) || amount < 100) {
        statusEl.textContent = "100P 이상 입력해주세요.";
        statusEl.className = "status-msg error";
        return;
      }
      const btn = document.getElementById("predict-bet-submit-btn");
      btn.disabled = true;
      statusEl.textContent = "베팅 중...";
      statusEl.className = "status-msg";
      try {
        const res = await authFetch(PREDICTIONS_URL, {
          method: "POST",
          body: JSON.stringify({ predictionId: currentPrediction.id, optionId: selectedOptionId, amount }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          if (data.error === "insufficient_balance") statusEl.textContent = "포인트가 부족해요.";
          else if (data.error === "already_bet") statusEl.textContent = "이미 이 투표에 베팅했어요.";
          else if (data.error === "prediction_closed") statusEl.textContent = "이미 마감된 투표예요.";
          else if (data.error === "amount_too_small") statusEl.textContent = "100P 이상 입력해주세요.";
          else if (data.error !== "banned") statusEl.textContent = "베팅에 실패했어요.";
          statusEl.className = "status-msg error";
          btn.disabled = false;
          await loadPrediction(); // 그 사이 마감/취소됐을 수 있으니 최신 상태로 다시 그림
          return;
        }
        statusEl.textContent = "베팅 완료!";
        statusEl.className = "status-msg ok";
        amountInput.value = "";
        const balanceEl = document.getElementById("predict-balance-value");
        if (balanceEl && typeof data.balance === "number") balanceEl.textContent = data.balance.toLocaleString("ko-KR");
        await loadPrediction();
      } catch (err) {
        console.error("[predict] 베팅 실패", err);
        statusEl.textContent = "베팅에 실패했어요.";
        statusEl.className = "status-msg error";
        btn.disabled = false;
      }
    });

    // --- 관리자 전용 화면 --------------------------------------------------------
    let currentAdminPredictionId = null;
    // 참여자 목록 팝업용 상태 — get-prediction-status가 전체 베팅을 한 번에 주므로
    // 서버 재배포 없이 클라이언트에서 10명 단위로 잘라서 보여줌(투표 하나의 참여자 수는
    // 크지 않을 것으로 보임 — 나중에 너무 많아지면 서버 페이지네이션으로 바꿀 수 있음).
    let currentAdminBets = [];
    let currentAdminOptionLabels = new Map();
    let betsModalPage = 1;
    const BETS_PAGE_SIZE = 10;
    // 정산 모달용 — 드롭다운 대신 옵션을 카드로 보여주고 고르게 함.
    let currentAdminOptions = [];
    let selectedResolveOptionId = null;

    function renderPagination(container, page, totalPages, onGoToPage) {
      if (totalPages <= 1) {
        container.innerHTML = "";
        return;
      }
      const pageSet = new Set([1, totalPages]);
      for (let p = page - 2; p <= page + 2; p++) {
        if (p >= 1 && p <= totalPages) pageSet.add(p);
      }
      const sorted = [...pageSet].sort((a, b) => a - b);

      let html = `<button type="button" class="page-btn" data-page="${page - 1}" ${page <= 1 ? "disabled" : ""}>이전</button>`;
      let prev = 0;
      for (const p of sorted) {
        if (prev && p - prev > 1) html += `<span class="page-ellipsis">…</span>`;
        html += `<button type="button" class="page-btn${p === page ? " active" : ""}" data-page="${p}">${p}</button>`;
        prev = p;
      }
      html += `<button type="button" class="page-btn" data-page="${page + 1}" ${page >= totalPages ? "disabled" : ""}>다음</button>`;
      container.innerHTML = html;
      container.querySelectorAll(".page-btn:not(:disabled)").forEach((btn) => {
        btn.addEventListener("click", () => onGoToPage(Number(btn.dataset.page)));
      });
    }

    function renderBetsModalPage() {
      const listEl = document.getElementById("predict-bets-modal-list");
      const emptyEl = document.getElementById("predict-bets-modal-empty");
      const paginationEl = document.getElementById("predict-bets-modal-pagination");
      const metaEl = document.getElementById("predict-bets-modal-meta");
      const total = currentAdminBets.length;
      metaEl.textContent = `총 ${total.toLocaleString("ko-KR")}명 참여`;
      if (total === 0) {
        listEl.innerHTML = "";
        emptyEl.hidden = false;
        paginationEl.innerHTML = "";
        return;
      }
      emptyEl.hidden = true;
      const totalPages = Math.max(1, Math.ceil(total / BETS_PAGE_SIZE));
      betsModalPage = Math.min(Math.max(1, betsModalPage), totalPages);
      const start = (betsModalPage - 1) * BETS_PAGE_SIZE;
      listEl.innerHTML = currentAdminBets.slice(start, start + BETS_PAGE_SIZE).map((b) => `
        <div class="predict-admin-bet-row">
          <span class="predict-admin-bet-who">${escapeHtml(b.channelName || "(이름 없음)")}<span class="predict-admin-bet-option">${escapeHtml(currentAdminOptionLabels.get(b.optionId) || "")}</span></span>
          <span class="predict-admin-bet-amount">${b.amount.toLocaleString("ko-KR")}P</span>
        </div>`).join("");
      renderPagination(paginationEl, betsModalPage, totalPages, (p) => { betsModalPage = p; renderBetsModalPage(); });
    }

    const predictBetsModal = document.getElementById("predict-bets-modal");
    document.getElementById("predict-admin-view-bets-btn").addEventListener("click", () => {
      betsModalPage = 1;
      if (!predictBetsModal.open) predictBetsModal.showModal();
      renderBetsModalPage();
    });
    document.getElementById("predict-bets-modal-close-btn").addEventListener("click", () => predictBetsModal.close());
    predictBetsModal.addEventListener("click", (e) => {
      if (e.target === predictBetsModal) predictBetsModal.close();
    });

    async function loadAdminStatus() {
      if (!isAdmin()) return;
      try {
        const res = await authFetch(ADMIN_URL, { method: "POST", body: JSON.stringify({ action: "get-prediction-status" }) });
        if (!res.ok) throw new Error(String(res.status));
        const data = await res.json();
        renderAdminStatus(data.prediction);
      } catch (err) {
        console.error("[predict] 관리자 현황 조회 실패", err);
      }
    }

    function renderAdminStatus(prediction) {
      const emptyEl = document.getElementById("predict-admin-empty");
      const statusEl = document.getElementById("predict-admin-status");
      const createBtn = document.getElementById("predict-create-btn");

      const isOpen = Boolean(prediction && prediction.status === "open");
      emptyEl.hidden = isOpen;
      statusEl.hidden = !isOpen;
      // 버튼 자체는 항상 보이되("투표 생성 버튼이 보여야" 하는 요구사항), 이미 진행 중인
      // 투표가 있으면(한 번에 하나만) 눌러도 서버가 already_open으로 거절하니 미리 막아둠.
      createBtn.disabled = isOpen;

      if (!isOpen) {
        currentAdminPredictionId = null;
        currentAdminBets = [];
        currentAdminOptionLabels = new Map();
        currentAdminOptions = [];
        return;
      }
      currentAdminPredictionId = prediction.id;

      document.getElementById("predict-admin-title").textContent = prediction.title;
      const closesAt = new Date(prediction.closesAt).getTime();
      const closed = closesAt <= Date.now();
      document.getElementById("predict-admin-countdown").textContent = closed
        ? "마감됨 — 정산 대기중"
        : `마감까지 ${formatCountdown(closesAt - Date.now())}`;

      document.getElementById("predict-admin-option-list").innerHTML = prediction.options.map((opt) => `
        <div class="predict-option disabled">
          <div class="predict-option-bar" style="width:${opt.percent.toFixed(1)}%"></div>
          <div class="predict-option-content">
            <span class="predict-option-label">${escapeHtml(opt.label)}</span>
            <span class="predict-option-stats">
              <span class="predict-option-percent">${opt.percent.toFixed(1)}%</span>
              <span class="predict-option-multiplier">${opt.totalAmount.toLocaleString("ko-KR")}P</span>
            </span>
          </div>
        </div>`).join("");

      currentAdminBets = prediction.bets || [];
      currentAdminOptionLabels = new Map(prediction.options.map((o) => [o.id, o.label]));
      currentAdminOptions = prediction.options;
      document.getElementById("predict-admin-view-bets-btn").textContent = `참여자 보기 (${currentAdminBets.length.toLocaleString("ko-KR")}명)`;
      // 팝업이 이미 열려있으면(정산/취소 전에 확인하면서 5초 폴링이 도는 동안) 그 자리에서
      // 최신 참여 내역으로 갱신함.
      if (document.getElementById("predict-bets-modal").open) renderBetsModalPage();

      const resolveBtn = document.getElementById("predict-resolve-btn");
      resolveBtn.disabled = !closed;
      resolveBtn.textContent = closed ? "정산하기" : "마감 후 정산 가능";
    }

    document.getElementById("predict-cancel-btn").addEventListener("click", async () => {
      if (!currentAdminPredictionId) return;
      if (!confirm("진행 중인 투표를 취소할까요? 걸린 포인트는 전액 환불돼요.")) return;
      const statusEl = document.getElementById("predict-admin-action-status");
      statusEl.textContent = "처리 중...";
      statusEl.className = "status-msg";
      try {
        const res = await authFetch(ADMIN_URL, { method: "POST", body: JSON.stringify({ action: "cancel-prediction", predictionId: currentAdminPredictionId }) });
        if (!res.ok) throw new Error(String(res.status));
        statusEl.textContent = "취소하고 환불했어요.";
        statusEl.className = "status-msg ok";
        await Promise.all([loadAdminStatus(), loadPrediction()]);
      } catch (err) {
        statusEl.textContent = "취소에 실패했어요.";
        statusEl.className = "status-msg error";
      }
    });

    // 정산 모달 — 드롭다운 대신 옵션을 predict-option 카드처럼 보여주고 골라서 확정하는
    // 방식(채팅 피드백: 기존 select+버튼 조합이 UI가 구려 보인다는 의견 반영).
    const predictResolveModal = document.getElementById("predict-resolve-modal");

    function openResolveModal() {
      selectedResolveOptionId = null;
      const listEl = document.getElementById("predict-resolve-option-list");
      const confirmBtn = document.getElementById("predict-resolve-confirm-btn");
      const statusEl = document.getElementById("predict-resolve-modal-status");
      document.getElementById("predict-resolve-modal-title").textContent = document.getElementById("predict-admin-title").textContent;
      statusEl.textContent = "";
      statusEl.className = "status-msg";
      confirmBtn.disabled = true;
      listEl.innerHTML = currentAdminOptions.map((opt) => `
        <div class="predict-option" data-option-id="${opt.id}">
          <div class="predict-option-content">
            <span class="predict-option-label">${escapeHtml(opt.label)}</span>
            <span class="predict-option-stats">
              <span class="predict-option-percent">${opt.percent.toFixed(1)}%</span>
              <span class="predict-option-multiplier">${opt.totalAmount.toLocaleString("ko-KR")}P</span>
            </span>
          </div>
        </div>`).join("");
      listEl.querySelectorAll(".predict-option").forEach((el) => {
        el.addEventListener("click", () => {
          selectedResolveOptionId = Number(el.dataset.optionId);
          listEl.querySelectorAll(".predict-option").forEach((o) => {
            o.classList.toggle("selected", Number(o.dataset.optionId) === selectedResolveOptionId);
          });
          confirmBtn.disabled = false;
        });
      });
      if (!predictResolveModal.open) predictResolveModal.showModal();
    }

    document.getElementById("predict-resolve-btn").addEventListener("click", () => {
      if (!currentAdminPredictionId) return;
      openResolveModal();
    });
    document.getElementById("predict-resolve-modal-cancel-btn").addEventListener("click", () => predictResolveModal.close());
    predictResolveModal.addEventListener("click", (e) => {
      if (e.target === predictResolveModal) predictResolveModal.close();
    });

    document.getElementById("predict-resolve-confirm-btn").addEventListener("click", async () => {
      if (!currentAdminPredictionId || selectedResolveOptionId == null) return;
      const modalStatusEl = document.getElementById("predict-resolve-modal-status");
      const confirmBtn = document.getElementById("predict-resolve-confirm-btn");
      confirmBtn.disabled = true;
      modalStatusEl.textContent = "정산 중...";
      modalStatusEl.className = "status-msg";
      const statusEl = document.getElementById("predict-admin-action-status");
      try {
        const res = await authFetch(ADMIN_URL, { method: "POST", body: JSON.stringify({ action: "resolve-prediction", predictionId: currentAdminPredictionId, winningOptionId: selectedResolveOptionId }) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          modalStatusEl.textContent = data.error === "not_closed_yet" ? "아직 마감 전이에요." : "정산에 실패했어요.";
          modalStatusEl.className = "status-msg error";
          confirmBtn.disabled = false;
          return;
        }
        predictResolveModal.close();
        statusEl.textContent = "정산 완료했어요.";
        statusEl.className = "status-msg ok";
        await Promise.all([loadAdminStatus(), loadPrediction()]);
      } catch (err) {
        modalStatusEl.textContent = "정산에 실패했어요.";
        modalStatusEl.className = "status-msg error";
        confirmBtn.disabled = false;
      }
    });

    // --- 투표 생성 모달 ----------------------------------------------------------
    // 기본 2개 항목, 3번째부터만 삭제(X) 버튼이 붙음(요청사항 — 최소 2개는 항상 유지).
    let createOptions = ["", ""];

    function renderCreateOptions() {
      const container = document.getElementById("predict-option-inputs");
      container.innerHTML = createOptions.map((val, i) => `
        <div class="predict-create-option-row" data-index="${i}">
          <input type="text" class="notice-title-input predict-option-input" maxlength="40" placeholder="투표 항목 ${i + 1}" value="${escapeHtml(val)}">
          ${i >= 2 ? `<button type="button" class="predict-option-remove-btn" data-index="${i}" aria-label="항목 삭제">×</button>` : ""}
        </div>`).join("");
      container.querySelectorAll(".predict-option-input").forEach((input, i) => {
        input.addEventListener("input", (e) => { createOptions[i] = e.target.value; });
      });
      container.querySelectorAll(".predict-option-remove-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          createOptions.splice(Number(btn.dataset.index), 1);
          renderCreateOptions();
        });
      });
    }

    document.getElementById("predict-add-option-btn").addEventListener("click", () => {
      createOptions.push("");
      renderCreateOptions();
    });

    document.querySelectorAll('input[name="predict-duration"]').forEach((radio) => {
      radio.addEventListener("change", () => {
        document.querySelectorAll(".predict-duration-option").forEach((label) => {
          label.classList.toggle("selected", label.querySelector("input").checked);
        });
      });
    });

    document.getElementById("predict-create-btn").addEventListener("click", () => {
      createOptions = ["", ""];
      renderCreateOptions();
      document.getElementById("predict-title-input").value = "";
      document.querySelectorAll('input[name="predict-duration"]').forEach((r) => { r.checked = false; });
      document.querySelectorAll(".predict-duration-option").forEach((l) => l.classList.remove("selected"));
      const statusEl = document.getElementById("predict-create-status");
      statusEl.textContent = "";
      statusEl.className = "status-msg";
      document.getElementById("predict-create-modal").showModal();
    });
    document.getElementById("predict-create-cancel-btn").addEventListener("click", () => {
      document.getElementById("predict-create-modal").close();
    });

    document.getElementById("predict-create-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById("predict-create-status");
      const title = document.getElementById("predict-title-input").value.trim();
      const options = createOptions.map((o) => o.trim()).filter((o) => o.length > 0);
      const durationInput = document.querySelector('input[name="predict-duration"]:checked');

      if (!title) {
        statusEl.textContent = "투표 이름을 입력해주세요.";
        statusEl.className = "status-msg error";
        return;
      }
      if (options.length < 2) {
        statusEl.textContent = "투표 항목을 2개 이상 입력해주세요.";
        statusEl.className = "status-msg error";
        return;
      }
      if (!durationInput) {
        statusEl.textContent = "투표 시간을 선택해주세요.";
        statusEl.className = "status-msg error";
        return;
      }

      const submitBtn = document.getElementById("predict-create-submit-btn");
      submitBtn.disabled = true;
      statusEl.textContent = "생성 중...";
      statusEl.className = "status-msg";
      try {
        const res = await authFetch(ADMIN_URL, {
          method: "POST",
          body: JSON.stringify({ action: "create-prediction", title, options, durationMinutes: Number(durationInput.value) }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          statusEl.textContent = data.error === "already_open" ? "이미 진행 중인 투표가 있어요." : "생성에 실패했어요.";
          statusEl.className = "status-msg error";
          submitBtn.disabled = false;
          return;
        }
        document.getElementById("predict-create-modal").close();
        await Promise.all([loadAdminStatus(), loadPrediction()]);
      } catch (err) {
        statusEl.textContent = "생성에 실패했어요.";
        statusEl.className = "status-msg error";
      } finally {
        submitBtn.disabled = false;
      }
    });

    // --- 타이머 --------------------------------------------------------------
    // 카운트다운은 1초마다 텍스트만 갱신(전체 재렌더 아님 — 베팅 입력칸 값이나 선택 상태를
    // 안 건드리기 위함), 마감 순간(active→closed 전환)에만 한 번 전체를 다시 그림. 실제 데이터
    // (걸린 포인트 비율 등)는 5초마다 폴링해서 새로고침 없이도 다른 사람 베팅이 반영되게 함.
    let countdownTimer = null;
    let pollTimer = null;

    function startTimers() {
      if (!countdownTimer) {
        countdownTimer = setInterval(() => {
          if (currentPrediction && currentPrediction.status === "open") {
            const closesAt = new Date(currentPrediction.closesAt).getTime();
            const now = Date.now();
            if (closesAt > now) {
              const countdownEl = document.getElementById("predict-countdown");
              countdownEl.hidden = false;
              countdownEl.textContent = `마감까지 ${formatCountdown(closesAt - now)}`;
              countdownEl.classList.toggle("is-urgent", closesAt - now < 30000);
            } else {
              renderPrediction();
            }
          }
          if (isAdmin() && currentAdminPredictionId) {
            const el = document.getElementById("predict-admin-countdown");
            if (el && el.textContent.startsWith("마감까지")) {
              loadAdminStatus();
            }
          }
        }, 1000);
      }
      if (!pollTimer) {
        pollTimer = setInterval(() => {
          loadPrediction();
          if (isAdmin()) loadAdminStatus();
        }, 5000);
      }
    }

    window.__pageCleanup = () => {
      if (countdownTimer) clearInterval(countdownTimer);
      if (pollTimer) clearInterval(pollTimer);
      countdownTimer = null;
      pollTimer = null;
    };

    renderSidebarUser();
    initSidebarToggle();
    initAdminNav();
    initShopNavGroup();
    initNoticeBadge();

    (async () => {
      const loadingEl = document.getElementById("loading-state");
      if (!isLoggedIn()) {
        loadingEl.hidden = true;
        document.getElementById("logged-out").hidden = false;
        return;
      }
      const res = await authFetch(ME_URL);
      if (!res.ok) {
        loadingEl.hidden = true;
        document.getElementById("logged-out").hidden = false;
        return;
      }
      const profile = await res.json();
      document.getElementById("predict-balance-value").textContent = profile.balance.toLocaleString("ko-KR");
      loadingEl.hidden = true;
      document.getElementById("predict-balance-card").hidden = false;
      document.getElementById("logged-in").hidden = false;

      if (isAdmin()) {
        document.getElementById("predict-admin-card").hidden = false;
        await loadAdminStatus();
      }
      await loadPrediction();
      startTimers();
    })();
  })();
  </script>
</body>
</html>
