  <script src="assets/js/chzzk-auth.js?v=20"></script>
  <script src="assets/js/spa-router.js?v=8"></script>
  <script>
  // index.html과 같은 이유로 IIFE + 동적 import() 사용 (spa-router.js가 페이지 이동마다
  // 이 스크립트를 다시 실행하므로, 최상위 const/let은 두 번째 실행에서 에러가 남).
  (function () {
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // 비공개 유저는 이름이 이미 "비공개"로 가려져서 내려옴(뷰에서 처리) — 본인 행도 예외 없이
    // 그대로 보여줌 (본인 계정이 비공개 상태면 본인 눈에도 "비공개"로 보여야 설정이 잘
    // 적용됐는지 헷갈리지 않음). 포인트 구간 칭호(자동)는 배지가 아니라 이름 색으로 표시하고
    // (applyTierColorToName), 상점 구매 칭호(장착)만 "[칭호명]" 배지로 앞에 붙임
    // (renderShopTitleBadgeHtml) — 둘 다 chzzk-auth.js 공용 함수.
    function renderRankingRow(row, i, myChannelId) {
      const isMe = row.channel_id === myChannelId;
      const isPrivate = row.is_public === false;
      const shopBadge = renderShopTitleBadgeHtml(row.shop_title_name, row.shop_title_color);
      // 등급(브론즈~다이아) 이름 색은 목록에서 안 씀 — 이름은 전부 흰색으로 통일(요청사항). 등급 자체는
      // 그대로 있고 마이페이지 "등급" 칸에서 보임.
      const coloredName = escapeHtml(row.channel_name || "(이름 없음)");
      return `
        <li class="${isMe ? "me" : ""}">
          <span class="rank">${i + 1}</span>
          <span class="name${isPrivate ? " is-private" : ""}">${shopBadge}${coloredName}${isMe ? " (나)" : ""}</span>
          <span class="points">${row.total_points.toLocaleString("ko-KR")}P</span>
        </li>`;
    }

    const RANKING_LIMIT = 50;

    async function loadRanking(supabase) {
      const { data, error } = await supabase
        .from("ranking")
        .select("channel_id, channel_name, total_points, is_public, tier_title_name, tier_title_color, shop_title_name, shop_title_color")
        .order("total_points", { ascending: false })
        .limit(RANKING_LIMIT);

      const listEl = document.getElementById("ranking-list");
      const emptyEl = document.getElementById("empty-msg");
      if (!listEl || !emptyEl) return; // 다른 페이지로 이미 넘어간 뒤 늦게 도착한 응답이면 무시

      if (error) {
        console.error("[ranking] 조회 실패", error);
        emptyEl.textContent = "랭킹을 불러오지 못했어요.";
        emptyEl.hidden = false;
        listEl.innerHTML = "";
      } else if (!data || data.length === 0) {
        emptyEl.hidden = false;
        listEl.innerHTML = "";
      } else {
        const myChannelId = typeof getChannelId === "function" ? getChannelId() : null;
        listEl.innerHTML = data.map((row, i) => renderRankingRow(row, i, myChannelId)).join("");
      }
    }

    (async () => {
      renderSidebarUser();
      initSidebarToggle();
      initAdminNav();
      initShopNavGroup();
      initNoticeBadge();
      verifySessionInBackground();

      const { supabase } = await import("./assets/js/supabase-client.js");
      await loadRanking(supabase);

      // 실시간 갱신: points_ledger는 RLS로 막혀있어 직접 구독할 수 없어서, 그 대신 매
      // insert마다 트리거가 채워주는 ranking_pings(공개 읽기 가능한 신호용 테이블)를 구독함
      // (0019_admin_features.sql 참고). 관리자가 일괄 지급을 하면 짧은 시간에 ping이 여러 번
      // 올 수 있어서 debounce로 묶어서 한 번만 다시 불러옴.
      let refetchTimer = null;
      const channel = supabase
        .channel("ranking_pings_page")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "ranking_pings" }, () => {
          clearTimeout(refetchTimer);
          refetchTimer = setTimeout(() => loadRanking(supabase), 800);
        })
        .subscribe();

      window.__pageCleanup = () => {
        clearTimeout(refetchTimer);
        supabase.removeChannel(channel);
      };
    })();
  })();
  </script>
