  <script>
  // index.html과 같은 이유로 IIFE + 동적 import() 사용 (spa-router.js가 페이지 이동마다
  // 이 스크립트를 다시 실행하므로, 최상위 const/let은 두 번째 실행에서 에러가 남).
  (function () {
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // 비공개 유저는 이름이 이미 "비공개"로 가려져서 내려옴(뷰에서 처리) — 본인 행도 예외 없이
    // 그대로 보여줌 (본인 계정이 비공개 상태면 본인 눈에도 "비공개"로 보여야 설정이 잘
    // 적용됐는지 헷갈리지 않음). 포인트 구간 칭호(자동)는 배지가 아니라 이름 색으로 표시하고
    // (applyTierColorToName), 상점 구매 칭호(장착)만 "[칭호명]" 배지로 앞에 붙임
    // (renderShopTitleBadgeHtml) — 둘 다 chzzk-auth.js 공용 함수.
    // 단, 관리자 화면은 예외 — 비공개 유저도 실제 이름·칭호로 내려오고(admin_view), 이름 앞에 "비공개"
    // 표시만 붙음(rankingPrivateTagHtml). 한눈에 전체 순위를 보려는 용도.
    function renderRankingRow(row, i) {
      const isMe = isMyRankingRow(row);
      const isPrivate = row.is_public === false;
      const shopBadge = renderShopTitleBadgeHtml(row.shop_title_name, row.shop_title_color);
      // 특수 칭호(지난달 1위·관리자 지급)는 장착 칭호 앞에 항상 붙음(renderSpecialTitleBadgesHtml, chzzk-auth.js).
      const specialBadges = renderSpecialTitleBadgesHtml(row.special_titles);
      // 등급(브론즈~다이아) 이름 색은 목록에서 안 씀 — 이름은 전부 흰색으로 통일(요청사항). 등급 자체는
      // 그대로 있고 마이페이지 "등급" 칸에서 보임.
      const coloredName = escapeHtml(row.channel_name || "(이름 없음)");
      // 관리자 화면(admin_view)에서만 이름을 눌러 그 유저의 상세 모달(내역·칭호·미니게임 차단)을 엶. 일반 유저에겐
      // 아무 표시/반응도 없음(admin_view 행은 관리자 API로만 내려옴).
      const adminClickAttrs = row.admin_view && row.channel_id
        ? ` data-admin-channel-id="${escapeHtml(row.channel_id)}" style="cursor:pointer"`
        : "";
      return `
        <li class="${isMe ? "me" : ""}">
          <span class="rank">${i + 1}</span>
          <span class="name${isPrivate && !row.admin_view ? " is-private" : ""}"${adminClickAttrs}>${rankingPrivateTagHtml(row)}${specialBadges}${shopBadge}${coloredName}${isMe ? " (나)" : ""}</span>
          <span class="points">${row.total_points.toLocaleString("ko-KR")}P</span>
        </li>`;
    }

    const RANKING_LIMIT = 50;

    // 유저 상세 모달은 admin.html과 같이 쓰는 공용 파일 — 관리자가 이름을 처음 눌렀을 때만 불러옴.
    function loadAdminUserModal() {
      if (window.AdminUserModal) return Promise.resolve(window.AdminUserModal);
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = "assets/js/admin-user-modal.js?v=2";
        s.onload = () => resolve(window.AdminUserModal);
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    async function loadRanking(supabase) {
      // 관리자면 비공개 유저도 실제 이름으로(fetchRankingRows, chzzk-auth.js).
      const { data, error } = await fetchRankingRows(supabase, RANKING_LIMIT);

      const listEl = document.getElementById("ranking-list");
      const emptyEl = document.getElementById("empty-msg");
      if (!listEl || !emptyEl) return; // 다른 페이지로 이미 넘어간 뒤 늦게 도착한 응답이면 무시

      if (error) {
        console.error("[ranking] 조회 실패", error);
        emptyEl.textContent = "랭킹을 불러오지 못했어요.";
        emptyEl.hidden = false;
        listEl.innerHTML = "";
      } else if (!data || data.length === 0) {
        emptyEl.hidden = false;
        listEl.innerHTML = "";
      } else {
        listEl.innerHTML = data.map((row, i) => renderRankingRow(row, i)).join("");
      }
    }

    (async () => {
      renderSidebarUser();
      initSidebarToggle();
      initAdminNav();
      initShopNavGroup();
      initNoticeBadge();
      verifySessionInBackground();

      const { supabase } = await import("./assets/js/supabase-client.js");
      await loadRanking(supabase);

      // 관리자만: 이름 클릭 → 유저 상세 모달. 일반 유저는 data-admin-channel-id가 없어서 아무 일도 안 일어남.
      // 모달 안에서 잔액이 바뀔 수 있으니(실행취소 등) 닫힌 뒤가 아니라 바뀐 즉시 랭킹도 다시 불러옴.
      const rankingListEl = document.getElementById("ranking-list");
      const onNameClick = async (e) => {
        const nameEl = e.target.closest("[data-admin-channel-id]");
        if (!nameEl || !isAdmin()) return;
        try {
          const modal = await loadAdminUserModal();
          await modal.open(nameEl.dataset.adminChannelId, { onChanged: () => loadRanking(supabase) });
        } catch (err) {
          console.error("[ranking] 유저 상세 모달 열기 실패", err);
          alert("유저 정보를 열지 못했어요.");
        }
      };
      if (rankingListEl) rankingListEl.addEventListener("click", onNameClick);

      // 실시간 갱신: points_ledger는 RLS로 막혀있어 직접 구독할 수 없어서, 그 대신 매
      // insert마다 트리거가 채워주는 ranking_pings(공개 읽기 가능한 신호용 테이블)를 구독함
      // (0019_admin_features.sql 참고). 미니게임 한 판마다 신호가 오니 createRankingRefresher(chzzk-auth.js)로
      // 8초에 한 번까지만, 탭이 보일 때만 다시 불러옴.
      const refresher = createRankingRefresher(() => loadRanking(supabase));
      const channel = supabase
        .channel("ranking_pings_page")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "ranking_pings" }, () => refresher.ping())
        .subscribe();

      // 비공개 상태 본인 줄 "(나)" 표시용 값(rankKey)이 /me로 막 도착했으면 다시 그림(chzzk-auth.js).
      const onRankKey = () => loadRanking(supabase);
      window.addEventListener("chzzk:rankkey", onRankKey);

      window.__pageCleanup = () => {
        refresher.dispose();
        supabase.removeChannel(channel);
        window.removeEventListener("chzzk:rankkey", onRankKey);
      };
    })();
  })();
  </script>
