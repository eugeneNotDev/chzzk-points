  <script>
  // 다른 페이지들과 같은 이유로 IIFE로 감쌈 (라우터가 페이지 이동마다 이 스크립트를 다시 실행함).
  //
  // 홀짝: 홀이나 짝을 누르는 순간 바로 한 판 시작. 카드(A=1 ~ 10)와 결과는 서버(odd-even 함수 → DB의
  // odd_even_play)가 정하고, 화면은 카드가 섞였다가 뒤집히는 연출만 함. 카드 무늬(♠♥♦♣)는 보기용으로
  // 화면에서 아무거나 고름(결과와 상관없음). 결과가 나오고 2초 뒤에 다시 할 수 있음.
  (function () {
    const MIN_BET = 100;
    const REDUCED_MOTION = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const SHUFFLE_MIN_MS = REDUCED_MOTION ? 250 : 950; // 섞는 연출 최소 시간(서버 응답이 빨라도 이만큼은 보여줌)
    const FLIP_MS = REDUCED_MOTION ? 50 : 720;         // 카드 뒤집히는 시간(CSS .oe-flip transition과 맞춤)
    const AFTER_RESULT_WAIT_MS = 2000;
    // 서버(odd_even_play)는 한 판 하고 3초 안에는 다시 못 하게 막음 — 화면 대기도 그보다 짧아지지 않게 맞춤.
    const SERVER_COOLDOWN_MS = 3000;
    const MAX_BET = 400000000; // 서버가 받는 최대(기술적 한계, 실제로 닿을 일 없음)
    const PICK_KO = { odd: "홀", even: "짝" };
    const RESULT_KO = { win: "맞힘", lose: "틀림" };
    const RESULT_COLOR = { win: "#2fb574", lose: "#e03141" };
    const SUITS = [["spade", false], ["heart", true], ["diamond", true], ["club", false]];

    let state = null;      // GET 응답
    let playing = false;
    let waitUntil = 0;     // 이 시각 전까지는 다시 못 함(결과 후 2초 / 서버 쿨타임)
    const timers = [];
    // 다른 페이지로 넘어가면 true — 요청/타이머가 끝난 뒤 이미 떠난 페이지(또는 다시 들어온 새 페이지)를
    // 건드리지 않게 막음.
    let disposed = false;

    const fmt = (n) => Number(n).toLocaleString("ko-KR");
    const $ = (id) => document.getElementById(id);
    function later(fn, ms) { const t = setTimeout(() => { if (!disposed) fn(); }, ms); timers.push(t); return t; }
    const sleep = (ms) => new Promise((resolve) => { const t = setTimeout(resolve, ms); timers.push(t); });
    const pickButtons = () => Array.from(document.querySelectorAll(".oe-pick"));
    const cardLabel = (n) => (n === 1 ? "A" : String(n));
    const parityOf = (n) => (n % 2 === 1 ? "odd" : "even");

    // ── 걸 포인트 입력 ──
    function betValue() { return parseInt(String($("oe-bet-input").value).replace(/[^0-9]/g, ""), 10) || 0; }
    function setBet(v) { $("oe-bet-input").value = v > 0 ? fmt(v) : ""; validate(); }
    function balance() { return state ? state.balance : 0; }

    function validate() {
      const hint = $("game-hint"), input = $("oe-bet-input");
      if (!hint || !input) return false;
      const v = betValue();
      let msg = `최소 ${fmt(MIN_BET)}P부터 걸 수 있어요 · 홀이나 짝을 누르면 바로 시작돼요`;
      let bad = false;
      if (!state || !state.eligible) { bad = true; msg = `${state?.requiredTierName || "브론즈"} 등급부터 할 수 있어요`; }
      else if (balance() < MIN_BET) { bad = true; msg = `${fmt(MIN_BET)}P 이상 있어야 할 수 있어요`; }
      else if (v < MIN_BET) { bad = true; msg = `${fmt(MIN_BET)}P 이상 걸어야 해요`; }
      else if (v > balance()) { bad = true; msg = "보유 포인트보다 많이 걸 수 없어요"; }
      else if (v > MAX_BET) { bad = true; msg = `한 번에 ${fmt(MAX_BET)}P까지 걸 수 있어요`; }
      const waiting = Date.now() < waitUntil;
      if (!bad && waiting && !playing) msg = "잠시 후 다시 할 수 있어요";
      hint.textContent = msg;
      hint.classList.toggle("is-bad", bad && !!state && state.eligible);
      input.classList.toggle("is-bad", bad && !!state && state.eligible && v > 0);
      pickButtons().forEach((b) => { b.disabled = bad || playing || waiting; });
      return !bad;
    }

    function renderBalance() { $("game-balance").textContent = fmt(balance()); }
    function syncGlobalBalance(v) {
      // 모바일 상단바/더보기 시트의 포인트 표시도 같이 갱신(chzzk-auth.js가 캐시값을 씀).
      try { localStorage.setItem(BALANCE_CACHE_KEY, String(v)); } catch {}
      if (typeof renderMobileUser === "function") renderMobileUser();
    }

    function renderLock() {
      const lock = $("game-lock");
      if (state.eligible) { lock.hidden = true; return; }
      const need = state.requiredPoints, have = state.maxBalanceReached;
      $("game-lock-title").textContent = `${state.requiredTierName || "브론즈"} 등급부터 참여할 수 있어요`;
      $("game-lock-desc").textContent = `최고 보유 포인트 기준이에요. 지금 ${fmt(have)}P · ${fmt(Math.max(0, need - have))}P 더 모으면 열려요.`;
      $("game-lock-bar").style.width = `${Math.min(100, need > 0 ? (have / need) * 100 : 100)}%`;
      lock.hidden = false;
    }

    function timeLabel(iso) {
      return new Intl.DateTimeFormat("ko-KR", { timeZone: "Asia/Seoul", year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date(iso));
    }
    function recentItemHtml(r) {
      const net = r.payout - r.bet;
      const cls = net > 0 ? "is-plus" : net < 0 ? "is-minus" : "is-even";
      const sign = net > 0 ? "+" : net === 0 ? "±" : "";
      return `<li>
        <span class="game-recent-mult" style="--c:${RESULT_COLOR[r.result] || "#6b7480"}">${RESULT_KO[r.result] || "-"}</span>
        <span class="game-recent-bet">${fmt(r.bet)}P · ${PICK_KO[r.pick] || "-"} 선택 · 카드 ${cardLabel(r.card)}(${PICK_KO[parityOf(r.card)]})</span>
        <span class="game-recent-time muted">${timeLabel(r.createdAt)}</span>
        <span class="game-recent-net ${cls}">${sign}${fmt(net)}P</span>
      </li>`;
    }
    function renderRecent() {
      $("game-recent").innerHTML = state.recent.length
        ? state.recent.map(recentItemHtml).join("")
        : `<li class="game-recent-empty muted">아직 한 판도 안 했어요.</li>`;
    }

    function showResult(res, bet, pick) {
      const el = $("game-result");
      const cls = res.net > 0 ? "is-plus" : "is-minus";
      const sign = res.net > 0 ? "+" : "";
      el.className = `game-result ${cls}`;
      el.style.setProperty("--c", RESULT_COLOR[res.result]);
      el.innerHTML = `<strong>${RESULT_KO[res.result]} · ${sign}${fmt(res.net)}P</strong><span class="muted">${PICK_KO[pick]} 선택 · 카드 ${cardLabel(res.card)} · ${fmt(bet)}P 걸어서 ${fmt(res.payout)}P 받았어요</span>`;
      el.hidden = false;
    }
    function showError(msg) {
      const el = $("game-result");
      el.className = "game-result is-error";
      el.style.removeProperty("--c");
      el.innerHTML = `<span>${msg}</span>`;
      el.hidden = false;
    }

    // ── 카드 연출 ──
    function renderFront(card) {
      const [suit, red] = SUITS[Math.floor(Math.random() * SUITS.length)];
      const label = cardLabel(card);
      const icon = `<svg aria-hidden="true"><use href="#oe-s-${suit}"/></svg>`;
      const front = $("oe-front");
      front.className = `oe-side oe-front${red ? " is-red" : ""}`;
      front.innerHTML = `<span class="oe-corner is-tl">${label}${icon}</span><span class="oe-num">${label}</span>${icon}<span class="oe-corner is-br">${label}${icon}</span>`;
    }
    async function closeCard() {
      const flip = $("oe-flip");
      if (!flip || !flip.classList.contains("is-open")) return;
      flip.classList.add("is-quick");
      flip.classList.remove("is-open");
      await sleep(REDUCED_MOTION ? 30 : 260);
      $("oe-flip")?.classList.remove("is-quick");
    }
    function clearMarks() {
      pickButtons().forEach((b) => b.classList.remove("is-chosen", "is-hit"));
      const reveal = $("oe-reveal");
      if (reveal) reveal.innerHTML = "";
    }

    function startWait(ms) {
      waitUntil = Date.now() + ms;
      validate();
      later(() => {
        validate();
        pickButtons().forEach((b) => b.classList.remove("is-chosen"));
      }, ms + 30);
    }

    async function play(pick) {
      if (playing || Date.now() < waitUntil || !validate()) return;
      const bet = betValue();
      playing = true;
      validate();
      clearMarks();
      pickButtons().forEach((b) => b.classList.toggle("is-chosen", b.dataset.pick === pick));
      $("game-result").hidden = true;
      await closeCard();
      if (disposed) return;
      // 서버 응답을 기다리는 동안 카드를 계속 섞음(최소 SHUFFLE_MIN_MS는 보여줌).
      $("oe-deck").classList.add("is-shuffling");
      const started = Date.now(); // 요청 보낸 시각(섞기 최소 시간 + 서버 쿨타임 계산에 씀)

      let res, data;
      try {
        res = await authFetch(ODD_EVEN_URL, { method: "POST", body: JSON.stringify({ bet, pick }) });
        data = await res.json().catch(() => ({}));
      } catch (err) {
        console.error("[odd-even] 요청 실패", err);
        data = { error: "network" };
        res = { ok: false };
      }
      const remain = SHUFFLE_MIN_MS - (Date.now() - started);
      if (remain > 0) await sleep(remain);
      if (disposed || !$("oe-deck")) return; // 그 사이 다른 페이지로 이동함
      $("oe-deck").classList.remove("is-shuffling");

      if (!res.ok) {
        playing = false;
        pickButtons().forEach((b) => b.classList.remove("is-chosen"));
        if (data.error === "cooldown") {
          showError(`너무 빨라요. ${data.retryAfterSeconds || 1}초 뒤에 다시 해주세요.`);
          startWait((data.retryAfterSeconds || 1) * 1000);
        } else if (data.error === "insufficient_balance") {
          showError("포인트가 부족해요.");
          await reloadStateSafely();
        } else if (data.error === "tier_required") {
          showError(`${state?.requiredTierName || "브론즈"} 등급부터 할 수 있어요.`);
          await reloadStateSafely();
        } else if (res.status === 401) {
          showLoggedOut();
          return;
        } else if (data.error === "invalid_bet") {
          showError(`${fmt(MIN_BET)}P 이상 걸어야 해요.`);
        } else if (data.error !== "banned" && res.status !== 401) {
          showError("홀짝을 하지 못했어요. 다시 시도해주세요.");
        }
        validate();
        return;
      }

      renderFront(data.card);
      $("oe-flip").classList.add("is-open");
      await sleep(FLIP_MS);
      if (disposed || !$("oe-flip")) return;

      const parity = parityOf(data.card);
      $("oe-reveal").innerHTML = `${cardLabel(data.card)} → <span class="is-${parity}">${PICK_KO[parity]}</span>`;
      pickButtons().forEach((b) => b.classList.toggle("is-hit", b.dataset.pick === parity));
      state.balance = data.balance;
      if (data.balance > state.maxBalanceReached) state.maxBalanceReached = data.balance;
      state.recent.unshift({ bet, pick, card: data.card, result: data.result, payout: data.payout, createdAt: new Date().toISOString() });
      state.recent = state.recent.slice(0, 10);
      renderBalance();
      renderRecent();
      syncGlobalBalance(data.balance);
      showResult(data, bet, pick);
      playing = false;
      if (betValue() > balance()) setBet(Math.max(MIN_BET, Math.min(betValue(), balance())));
      startWait(Math.max(AFTER_RESULT_WAIT_MS, SERVER_COOLDOWN_MS + 300 - (Date.now() - started)));
    }

    // 에러 후 상태를 다시 받아올 때 — 이것까지 실패해도(네트워크 등) 버튼이 잠긴 채로 남지 않게 항상 다시 검사함.
    async function reloadStateSafely() {
      try { await loadState(); } catch (err) { console.error("[minigame] 상태 다시 조회 실패", err); }
      finally { if (!disposed) validate(); }
    }
    // 게임 중에 세션이 만료돼서 로그아웃된 경우(authFetch가 로그아웃 처리) — 로그인 안내 화면으로 바꿈.
    function showLoggedOut() {
      $("logged-in").hidden = true;
      $("logged-out").hidden = false;
    }

    async function loadState() {
      const res = await authFetch(ODD_EVEN_URL);
      if (!res.ok) return false;
      state = await res.json();
      if (!Array.isArray(state.recent)) state.recent = [];
      if (state.winMultiplier) $("oe-rule").textContent = `A~10 카드 한 장 · 맞히면 ${state.winMultiplier}배 · 틀리면 0`;
      renderBalance();
      renderLock();
      renderRecent();
      syncGlobalBalance(state.balance);
      if (state.cooldownSeconds > 0) startWait(state.cooldownSeconds * 1000);
      validate();
      return true;
    }

    $("oe-bet-input").addEventListener("input", () => { const v = betValue(); $("oe-bet-input").value = v ? fmt(v) : ""; validate(); });
    document.querySelectorAll(".game-chip").forEach((chip) => chip.addEventListener("click", () => {
      let v = betValue();
      if (chip.dataset.add) v += Number(chip.dataset.add);
      else if (chip.dataset.set === "half") v = Math.max(MIN_BET, Math.floor(balance() / 2));
      else if (chip.dataset.set === "max") v = Math.max(MIN_BET, balance());
      else v = MIN_BET;
      setBet(v);
    }));
    pickButtons().forEach((btn) => btn.addEventListener("click", () => play(btn.dataset.pick)));

    window.__pageCleanup = () => {
      disposed = true;
      timers.forEach((t) => { clearTimeout(t); clearInterval(t); });
    };

    renderSidebarUser();
    initSidebarToggle();
    initAdminNav();
    initShopNavGroup();
    initNoticeBadge();

    (async () => {
      if (!isLoggedIn()) {
        $("loading-state").hidden = true;
        $("logged-out").hidden = false;
        return;
      }
      const ok = await loadState().catch((err) => { console.error("[odd-even] 상태 조회 실패", err); return false; });
      $("loading-state").hidden = true;
      if (!ok) {
        $("logged-out").hidden = false;
        return;
      }
      $("logged-in").hidden = false;
      validate();
    })();
  })();
  </script>
</body>
</html>
