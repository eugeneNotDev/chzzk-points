  <script>
  // spa-router.js가 페이지 이동마다 이 스크립트를 다시 실행하므로 IIFE로 감쌈
  // (shopItems/currentBalance가 최상위 const/let이면 두 번째 실행에서 에러가 남).
  (function () {
    let supabase;

    // 상품 목록은 코드가 아니라 DB(shop_items 테이블)에서 가져옴 — 가격/이름/설명을
    // 바꾸거나 상품을 추가/비활성화할 때 배포 없이 Supabase 테이블 편집기에서 바로 할 수 있게
    // 하려고 이렇게 뺌 (0010_shop_items.sql 참고). anon 읽기는 is_active=true인 것만 보임.
    let shopItems = [];
    let currentBalance = 0;
    let isLive = false;
    // 구매(칭호 상점)로 잠금해제한 칭호 id 집합. /me 응답의 purchasedTitleIds로 채워지고,
    // 구매 성공 시 그 자리에서 바로 추가해서 새로고침 없이 "보유중"으로 바뀌게 함.
    let purchasedTitleIds = new Set();

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // 상품 카드 하나의 HTML 렌더링. 일반 상품/칭호 구매 상품을 같은 함수로 그림 — 칭호 상품은
    // grants_title_id가 있고, 이미 산 칭호면(purchasedTitleIds) "보유중"으로 표시하고
    // 버튼을 막음(소모성 상품과 달리 쿨타임이 아니라 "이미 있음" 상태라 영구적으로 막힘).
    // reordering: 관리자가 "순서 변경" 중인 섹션의 카드 — 사용/수정 버튼 대신 끌기 손잡이만 보여줌.
    function renderItemCard(item, admin, now, reordering = false) {
      const isTitleItem = Boolean(item.grants_title_id);
      const owned = isTitleItem && purchasedTitleIds.has(item.grants_title_id);
      const liveBlocked = item.requires_live && !isLive;
      const affordable = currentBalance >= item.cost;
      const until = cooldownUntil.get(item.id) ?? 0;
      const remaining = Math.ceil((until - now) / 1000);
      const onCooldown = remaining > 0;
      // 한정 수량(재고) — stock_limit이 null이면 무제한. 다 팔리면(sold_count >= stock_limit)
      // 상품이 사라지는 게 아니라 "품절" 상태로 버튼만 막힘(요청한 대로 재고 소진 ≠ 삭제).
      const stockLimit = item.stock_limit ?? null;
      const soldCount = item.sold_count ?? 0;
      const stockRemaining = stockLimit != null ? Math.max(0, stockLimit - soldCount) : null;
      const soldOut = stockLimit != null && stockRemaining <= 0;
      const inactive = admin && item.is_active === false;
      // 판매 중지된 상품은 관리자 화면에만 보이는데, 서버가 어차피 구매를 막으니 버튼도 막아둠.
      const usable = !owned && !soldOut && !liveBlocked && affordable && !onCooldown && !inactive;

      let label = isTitleItem ? "구매" : "사용";
      if (owned) label = "보유중";
      else if (inactive) label = "판매 중지됨";
      else if (soldOut) label = "품절";
      else if (onCooldown) label = `${remaining}초 후 사용 가능`;
      else if (liveBlocked) label = "방송 중에만 가능";
      else if (!affordable) label = "잔액 부족";
      // 비활성화 배지는 별도 줄로 왼쪽에, 수정/삭제 버튼은 그 아래 줄에서 가운데 정렬 —
      // 배지가 있을 때 margin-right:auto로 버튼을 오른쪽에 밀어붙이던 걸 없애고 항상 가운데로 통일.
      // 관리자 버튼: 수정 / 판매 중지(또는 다시 판매) / 삭제. 판매 중지는 상점에서만 내리는 것(산
      // 사람은 칭호 유지), 삭제는 완전히 지우는 것(칭호 상품이면 보유자한테서도 회수).
      const adminBar = admin && !reordering ? `
        <div class="shop-item-admin-bar">
          ${inactive ? '<span class="shop-item-inactive-badge">판매 중지</span>' : ""}
          <div class="shop-item-admin-buttons">
            <button type="button" class="secondary shop-item-edit-btn" data-item-id="${escapeHtml(item.id)}">수정</button>
            <button type="button" class="secondary shop-item-toggle-btn" data-item-id="${escapeHtml(item.id)}">${inactive ? "다시 판매" : "판매 중지"}</button>
            <button type="button" class="secondary shop-item-delete-btn" data-item-id="${escapeHtml(item.id)}">삭제</button>
          </div>
        </div>` : "";
      // 칭호 상품은 상품명 아래에 실제로 받게 될 칭호 배지를 보여줌(색까지 그대로).
      const titlePreview = isTitleItem
        ? `<div class="shop-item-title-preview">${titleBadgeHtml(item.titles?.name ?? item.name, item.titles?.color)}</div>`
        : "";
      const ownerNote = admin && isTitleItem && Number.isFinite(item.owner_count)
        ? `<p class="shop-item-owner-note">보유 ${item.owner_count.toLocaleString("ko-KR")}명</p>`
        : "";
      const stockNote = stockLimit != null
        ? `<p class="muted stock-note">${soldOut ? "품절되었어요" : `한정 ${stockRemaining.toLocaleString("ko-KR")}개 남음`}</p>`
        : "";
      const dragHandle = reordering
        ? `<button type="button" class="shop-item-drag-handle" aria-label="${escapeHtml(item.name)} 순서 옮기기 (방향키로 앞뒤 이동)" title="끌어서 옮기기"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></button>`
        : "";
      const useButton = reordering
        ? ""
        : `<button class="shop-item-use-btn" data-item-id="${escapeHtml(item.id)}" ${usable ? "" : "disabled"}>${label}</button>`;
      return `
        <div class="card shop-item${isTitleItem ? " title-item" : ""}${inactive ? " inactive" : ""}${owned ? " owned" : ""}${soldOut ? " sold-out" : ""}${reordering ? " reorder-card" : ""}" data-item-id="${escapeHtml(item.id)}">
          ${dragHandle}
          <h3>${escapeHtml(item.name)}</h3>
          ${titlePreview}
          <p class="desc">${escapeHtml(item.description || "")}</p>
          <p class="cost">${item.cost.toLocaleString("ko-KR")}P${item.requires_live ? ' <span class="muted">(방송 중에만)</span>' : ""}</p>
          ${stockNote}
          ${ownerNote}
          ${useButton}
          ${adminBar}
        </div>`;
    }

    function wireCardButtons(container, admin) {
      container.querySelectorAll(".shop-item-use-btn").forEach((btn) => {
        btn.addEventListener("click", () => useItem(btn.dataset.itemId, btn));
      });
      if (admin) {
        container.querySelectorAll(".shop-item-edit-btn").forEach((btn) => {
          btn.addEventListener("click", () => openShopItemModal("edit", btn.dataset.itemId));
        });
        container.querySelectorAll(".shop-item-delete-btn").forEach((btn) => {
          btn.addEventListener("click", () => deleteShopItem(btn.dataset.itemId));
        });
        container.querySelectorAll(".shop-item-toggle-btn").forEach((btn) => {
          btn.addEventListener("click", () => toggleShopItemActive(btn.dataset.itemId, btn));
        });
      }
    }

    // 일반 상품(shop-list)과 칭호 구매 상품(title-shop-list)을 grants_title_id 유무로 갈라서
    // 각각 다른 그리드에 그림. 관리자 화면에서는 판매 중지된 상품도 같이 받아오는데, 판매 중인
    // 상품과 섞으면 상점이 난잡해져서 각 섹션 맨 아래 "판매 중지된 상품 N개" 접힘 영역에 따로 모음.
    function renderSection({ key, items, admin, now, listId, emptyId, groupId, summaryId, inactiveListId }) {
      const listEl = document.getElementById(listId);
      const emptyEl = document.getElementById(emptyId);
      const groupEl = document.getElementById(groupId);
      const inactiveListEl = document.getElementById(inactiveListId);
      let activeItems = items.filter((item) => item.is_active !== false);
      const inactiveItems = admin ? items.filter((item) => item.is_active === false) : [];
      const reordering = admin && reorderIds[key] != null;
      if (reordering) activeItems = applyDraftOrder(activeItems, reorderIds[key]);

      listEl.innerHTML = activeItems.map((item) => renderItemCard(item, admin, now, reordering)).join("");
      listEl.classList.toggle("reordering", reordering);
      // 섹션 자체는 항상 띄워두고(사이드바 링크가 가리킬 대상이 항상 있어야 하니까), 판매 중인
      // 상품이 하나도 없을 때만 그리드 대신 "상품 준비 중입니다." 안내를 보여줌.
      emptyEl.hidden = activeItems.length > 0;
      if (reordering) wireReorderCards(listEl, key);
      else wireCardButtons(listEl, admin);
      if (admin) updateReorderToolbar(key, activeItems.length);

      groupEl.hidden = inactiveItems.length === 0;
      document.getElementById(summaryId).textContent = `판매 중지된 상품 ${inactiveItems.length}개`;
      inactiveListEl.innerHTML = inactiveItems.map((item) => renderItemCard(item, admin, now)).join("");
      wireCardButtons(inactiveListEl, admin);
    }

    function renderShop() {
      // 끄는 도중에 다시 그리면(쿨타임 카운트다운 등) 잡고 있던 카드가 사라지니, 놓은 뒤로 미룸.
      if (dragState) {
        renderQueued = true;
        return;
      }
      const now = Date.now();
      const admin = isAdmin();
      renderSection({
        key: "general",
        items: shopItems.filter((item) => !item.grants_title_id),
        admin, now,
        listId: "shop-list", emptyId: "shop-list-empty",
        groupId: "shop-inactive-group", summaryId: "shop-inactive-summary", inactiveListId: "shop-inactive-list",
      });
      renderSection({
        key: "title",
        items: shopItems.filter((item) => item.grants_title_id),
        admin, now,
        listId: "title-shop-list", emptyId: "title-shop-list-empty",
        groupId: "title-inactive-group", summaryId: "title-inactive-summary", inactiveListId: "title-inactive-list",
      });
    }

    // ── 상품 순서 변경(관리자) ────────────────────────────────────────────────
    // "순서 변경"을 누르면 그 섹션(일반/칭호)의 판매 중인 상품 카드를 끌어서 옮길 수 있음.
    // 끄는 동안 다른 카드들이 밀려나며 자리를 보여주고, "완료"를 누르면 서버에 한 번에 저장
    // (shop-items PATCH ?action=reorder), "취소"면 원래대로. PC는 카드 아무 데나, 폰(터치)은 화면
    // 스크롤과 겹치지 않게 카드 오른쪽 위 손잡이로만 끌 수 있음. 손잡이에서 방향키로도 옮길 수 있음.
    // reorderIds[key]: 순서 변경 중인 섹션의 판매 중 상품 id 목록(지금 화면 순서). null이면 평소 화면.
    const reorderIds = { general: null, title: null };
    let dragState = null;
    let renderQueued = false;
    const DRAG_THRESHOLD_PX = 5;
    const AUTO_SCROLL_EDGE_PX = 80;
    const prefersReducedMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function applyDraftOrder(items, ids) {
      const rank = new Map(ids.map((id, i) => [id, i]));
      // 순서 변경 중에 목록이 새로 불러와져서 모르는 상품이 생기면 맨 뒤에 붙임.
      return [...items].sort((a, b) => (rank.get(a.id) ?? Infinity) - (rank.get(b.id) ?? Infinity));
    }

    function reorderToolbarEls(key) {
      return {
        startBtn: document.querySelector(`[data-reorder-start="${key}"]`),
        bar: document.querySelector(`[data-reorder-bar="${key}"]`),
        addBtn: document.getElementById(key === "title" ? "title-item-add-btn" : "shop-item-add-btn"),
        section: document.getElementById(key === "title" ? "title-shop-section" : "general-shop-section"),
      };
    }

    function updateReorderToolbar(key, activeCount) {
      const { startBtn, bar, addBtn, section } = reorderToolbarEls(key);
      const on = reorderIds[key] != null;
      if (!startBtn) return;
      startBtn.hidden = on;
      addBtn.hidden = on;
      bar.hidden = !on;
      section.classList.toggle("shop-reordering", on);
      startBtn.disabled = activeCount < 2;
      startBtn.title = activeCount < 2 ? "판매 중인 상품이 2개 이상일 때 쓸 수 있어요" : "";
    }

    function activeItemsOf(key) {
      return shopItems.filter((item) => Boolean(item.grants_title_id) === (key === "title") && item.is_active !== false);
    }

    function startReorder(key) {
      reorderIds[key] = activeItemsOf(key).map((item) => item.id);
      const statusEl = document.getElementById("global-status");
      statusEl.textContent = "";
      statusEl.className = "status-msg";
      renderShop();
    }

    function stopReorder(key) {
      reorderIds[key] = null;
      renderShop();
    }

    function readDomOrder(listEl) {
      return [...listEl.querySelectorAll(".reorder-card")].map((el) => el.dataset.itemId);
    }

    async function saveReorder(key) {
      const statusEl = document.getElementById("global-status");
      const { bar } = reorderToolbarEls(key);
      const draft = reorderIds[key] ?? [];
      const original = activeItemsOf(key).map((item) => item.id);
      if (draft.join("\n") === original.join("\n")) {
        stopReorder(key);
        return;
      }
      // 서버에는 그 탭 상품 전부를 보냄 — 판매 중인 건 새 순서, 판매 중지된 건 지금 순서 그대로 그 뒤에.
      const inactiveIds = shopItems
        .filter((item) => Boolean(item.grants_title_id) === (key === "title") && item.is_active === false)
        .map((item) => item.id);
      const ids = [...draft, ...inactiveIds];
      bar.querySelectorAll("button").forEach((b) => { b.disabled = true; });
      statusEl.className = "status-msg";
      statusEl.textContent = "순서 저장 중...";
      try {
        const res = await authFetch(`${SHOP_ITEMS_URL}?action=reorder`, { method: "PATCH", body: JSON.stringify({ ids }) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          if (data.error === "stale_order" || data.error === "invalid_order") {
            // 그 사이 상품이 추가/삭제됐거나 목록이 어긋남 — 최신 목록으로 다시 그리고 다시 하게 함.
            await loadShopItems();
            reorderIds[key] = null;
            renderShop();
            statusEl.className = "status-msg error";
            statusEl.textContent = "그 사이 상품 목록이 바뀌어서 저장하지 못했어요. 다시 순서를 바꿔주세요.";
            return;
          }
          throw new Error(String(res.status));
        }
        await loadShopItems();
        reorderIds[key] = null;
        renderShop();
        statusEl.className = "status-msg ok";
        statusEl.textContent = "상품 순서를 저장했어요.";
      } catch (err) {
        console.error("[shop] 순서 저장 실패", err);
        statusEl.className = "status-msg error";
        statusEl.textContent = "순서를 저장하지 못했어요. 다시 시도해주세요.";
      } finally {
        bar.querySelectorAll("button").forEach((b) => { b.disabled = false; });
      }
    }

    // 카드를 before 앞으로 옮기면서(null이면 맨 뒤) 나머지 카드들이 원래 자리에서 새 자리로
    // 부드럽게 미끄러지게 함(FLIP: 옮기기 전 위치 기억 → 옮기고 → 차이만큼 되돌렸다가 0으로).
    function moveCardWithAnimation(listEl, card, before) {
      const cards = [...listEl.querySelectorAll(".reorder-card")];
      const firstRects = new Map(cards.map((el) => [el, el.getBoundingClientRect()]));
      cards.forEach((el) => el.getAnimations().forEach((a) => a.cancel()));
      listEl.insertBefore(card, before);
      if (prefersReducedMotion()) return;
      cards.forEach((el) => {
        if (el === card) return;
        const a = firstRects.get(el);
        const b = el.getBoundingClientRect();
        const dx = a.left - b.left;
        const dy = a.top - b.top;
        if (dx || dy) {
          el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }], { duration: 180, easing: "ease-out" });
        }
      });
    }

    // 포인터 위치(화면 좌표)에 맞춰 잡은 카드가 들어갈 자리를 정함. 다른 카드들을 읽는 순서(줄 → 왼쪽부터)로
    // 보면서 "포인터가 이 카드보다 앞"인 첫 카드 앞에 넣음. 애니메이션 중인 카드의 겉보기 위치 대신
    // 실제 배치 위치(offsetLeft/Top)로 판단해서 옮기는 도중에 자리가 왔다 갔다 하지 않게 함.
    function updateDropTarget(x, y) {
      const { card, listEl } = dragState;
      const listRect = listEl.getBoundingClientRect();
      const px = x - listRect.left;
      const py = y - listRect.top;
      const others = [...listEl.querySelectorAll(".reorder-card")].filter((el) => el !== card);
      let before = null;
      for (const el of others) {
        const top = el.offsetTop;
        const bottom = top + el.offsetHeight;
        if (py < top || (py <= bottom && px < el.offsetLeft + el.offsetWidth / 2)) {
          before = el;
          break;
        }
      }
      let currentNext = card.nextElementSibling;
      while (currentNext && !currentNext.classList.contains("reorder-card")) currentNext = currentNext.nextElementSibling;
      if (before === currentNext) return;
      moveCardWithAnimation(listEl, card, before);
    }

    function autoScrollStep() {
      if (!dragState || !dragState.started) return;
      const { lastY } = dragState;
      const vh = window.innerHeight;
      let speed = 0;
      if (lastY < AUTO_SCROLL_EDGE_PX) speed = -Math.ceil((AUTO_SCROLL_EDGE_PX - lastY) / 6);
      else if (lastY > vh - AUTO_SCROLL_EDGE_PX) speed = Math.ceil((lastY - (vh - AUTO_SCROLL_EDGE_PX)) / 6);
      if (speed !== 0) {
        window.scrollBy(0, speed);
        updateDropTarget(dragState.lastX, dragState.lastY);
      }
      dragState.scrollRaf = requestAnimationFrame(autoScrollStep);
    }

    function beginDrag() {
      const { card } = dragState;
      const rect = card.getBoundingClientRect();
      const ghost = card.cloneNode(true);
      ghost.classList.add("shop-drag-ghost");
      ghost.removeAttribute("data-item-id");
      ghost.setAttribute("aria-hidden", "true");
      ghost.style.width = `${rect.width}px`;
      ghost.style.height = `${rect.height}px`;
      ghost.style.left = `${rect.left}px`;
      ghost.style.top = `${rect.top}px`;
      document.body.appendChild(ghost);
      card.classList.add("drag-placeholder");
      document.body.classList.add("shop-dragging");
      dragState.ghost = ghost;
      dragState.started = true;
      const lefts = new Set([...dragState.listEl.querySelectorAll(".reorder-card")].map((el) => el.offsetLeft));
      dragState.singleColumn = lefts.size === 1;
      dragState.scrollRaf = requestAnimationFrame(autoScrollStep);
    }

    function onDragPointerMove(e) {
      if (!dragState || e.pointerId !== dragState.pointerId) return;
      dragState.lastX = e.clientX;
      dragState.lastY = e.clientY;
      if (!dragState.started) {
        if (Math.hypot(e.clientX - dragState.startX, e.clientY - dragState.startY) < DRAG_THRESHOLD_PX) return;
        beginDrag();
      }
      e.preventDefault();
      // 한 줄에 카드가 하나뿐인 화면(폰)에선 옆으로는 안 움직이게 — 위아래로만 따라다님.
      if (!dragState.singleColumn) dragState.ghost.style.left = `${e.clientX - dragState.offsetX}px`;
      dragState.ghost.style.top = `${e.clientY - dragState.offsetY}px`;
      updateDropTarget(e.clientX, e.clientY);
    }

    function onDragPointerEnd(e) {
      if (!dragState || e.pointerId !== dragState.pointerId) return;
      const { card, listEl, key, ghost, started, scrollRaf } = dragState;
      window.removeEventListener("pointermove", onDragPointerMove);
      window.removeEventListener("pointerup", onDragPointerEnd);
      window.removeEventListener("pointercancel", onDragPointerEnd);
      if (scrollRaf) cancelAnimationFrame(scrollRaf);
      dragState = null;
      if (started) {
        document.body.classList.remove("shop-dragging");
        reorderIds[key] = readDomOrder(listEl);
        // 떠 있던 카드가 새 자리로 쏙 들어가는 느낌만 짧게 주고 지움.
        const target = card.getBoundingClientRect();
        const finish = () => {
          ghost.remove();
          card.classList.remove("drag-placeholder");
        };
        if (prefersReducedMotion()) {
          finish();
        } else {
          const from = ghost.getBoundingClientRect();
          ghost.animate(
            [{ transform: "none" }, { transform: `translate(${target.left - from.left}px, ${target.top - from.top}px)` }],
            { duration: 140, easing: "ease-out", fill: "forwards" },
          ).finished.then(finish, finish);
        }
      }
      if (renderQueued) {
        renderQueued = false;
        renderShop();
      }
    }

    function onReorderPointerDown(e, card, listEl, key) {
      if (dragState || (e.pointerType === "mouse" && e.button !== 0)) return;
      // 터치/펜은 화면 스크롤과 겹치지 않게 손잡이를 잡았을 때만 끌기 시작.
      if (e.pointerType !== "mouse" && !e.target.closest(".shop-item-drag-handle")) return;
      e.preventDefault();
      const rect = card.getBoundingClientRect();
      dragState = {
        card, listEl, key,
        pointerId: e.pointerId,
        startX: e.clientX, startY: e.clientY,
        lastX: e.clientX, lastY: e.clientY,
        offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top,
        started: false, ghost: null, scrollRaf: null,
      };
      // 잡은 카드는 끄는 동안 목록 안에서 자리를 옮기는데(DOM 이동), 그러면 카드에 걸어둔 포인터
      // 캡처가 풀려버려서 이벤트는 창(window)에서 받음.
      window.addEventListener("pointermove", onDragPointerMove, { passive: false });
      window.addEventListener("pointerup", onDragPointerEnd);
      window.addEventListener("pointercancel", onDragPointerEnd);
    }

    // 손잡이에 포커스가 있을 때 ←/↑ = 한 칸 앞으로, →/↓ = 한 칸 뒤로, Home/End = 맨 앞/맨 뒤.
    function onReorderHandleKey(e, card, listEl, key) {
      const cards = [...listEl.querySelectorAll(".reorder-card")];
      const index = cards.indexOf(card);
      let next = index;
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = index - 1;
      else if (e.key === "ArrowRight" || e.key === "ArrowDown") next = index + 1;
      else if (e.key === "Home") next = 0;
      else if (e.key === "End") next = cards.length - 1;
      else return;
      e.preventDefault();
      if (next < 0 || next >= cards.length || next === index) return;
      const others = cards.filter((el) => el !== card);
      moveCardWithAnimation(listEl, card, others[next] ?? null);
      card.querySelector(".shop-item-drag-handle")?.focus();
      reorderIds[key] = readDomOrder(listEl);
      const live = document.getElementById("shop-reorder-live");
      if (live) live.textContent = `${next + 1}번째로 옮겼어요.`;
    }

    function wireReorderCards(listEl, key) {
      listEl.querySelectorAll(".reorder-card").forEach((card) => {
        card.addEventListener("pointerdown", (e) => onReorderPointerDown(e, card, listEl, key));
        const handle = card.querySelector(".shop-item-drag-handle");
        handle?.addEventListener("keydown", (e) => onReorderHandleKey(e, card, listEl, key));
      });
    }

    function setupReorderControls() {
      ["general", "title"].forEach((key) => {
        document.querySelector(`[data-reorder-start="${key}"]`)?.addEventListener("click", () => startReorder(key));
        document.querySelector(`[data-reorder-save="${key}"]`)?.addEventListener("click", () => saveReorder(key));
        document.querySelector(`[data-reorder-cancel="${key}"]`)?.addEventListener("click", () => stopReorder(key));
      });
    }

    async function loadLiveStatus() {
      try {
        const res = await fetch(BROADCAST_STATUS_URL);
        const data = await res.json();
        isLive = Boolean(data.isLive);
      } catch (err) {
        console.error("[shop] 방송 상태 조회 실패", err);
        isLive = false;
      }
    }

    // 관리자는 비활성 상품도 관리해야 해서 shop-items 함수(서비스 롤, 세션 검증)로 전체를
    // 받아옴. 일반 유저는 기존처럼 anon 키로 활성 상품만 직접 조회(RLS가 걸러줌).
    async function loadShopItems() {
      if (isAdmin()) {
        try {
          const res = await authFetch(SHOP_ITEMS_URL);
          if (!res.ok) throw new Error(String(res.status));
          const data = await res.json();
          shopItems = data.items ?? [];
          return;
        } catch (err) {
          console.error("[shop] 관리자용 상품 목록 조회 실패", err);
          // 실패해도 아래로 흘러서 최소한 일반 유저 화면(활성 상품만)이라도 보여줌.
        }
      }
      // 정렬은 관리자가 정한 순서(sort_order), 같으면 등록 순서 — shop-items 함수와 같음.
      // grants_title_id도 같이 받아와야 일반 유저 화면에서도 칭호 상점 섹션을 나눠 그릴 수 있고,
      // titles(name, color)는 칭호 상품 카드에 배지 미리보기를 그리는 데 씀.
      const { data, error } = await supabase
        .from("shop_items")
        .select("id, name, cost, description, requires_live, cooldown_seconds, grants_title_id, stock_limit, sold_count, titles(name, color)")
        .order("sort_order", { ascending: true })
        .order("created_at", { ascending: true })
        .order("id", { ascending: true });
      if (error) {
        console.error("[shop] 상품 목록 조회 실패", error);
        shopItems = [];
        return;
      }
      shopItems = data ?? [];
    }

    // 모달이 "일반 상품"/"칭호 상품" 중 어느 걸 다루고 있는지 — 필드 표시를 전환하는 기준.
    // 칭호 상품은 쿨타임/방송중 전용 개념이 없고(한 번 사면 끝), 대신 지급할 칭호명을 입력함.
    function applyModalItemType(itemType) {
      document.getElementById("shop-item-cooldown-row").hidden = itemType === "title";
      // 칭호 상품은 "방송 중에만 사용 가능"/"오버레이 알림 표시" 둘 다 의미가 없어서
      // (칭호 구매는 항상 showOnOverlay=false로 고정) 체크박스 줄 전체를 숨김.
      document.getElementById("shop-item-checkbox-row").hidden = itemType === "title";
      document.getElementById("shop-item-titlename-row").hidden = itemType !== "title";
      document.getElementById("shop-item-titlecolor-row").hidden = itemType !== "title";
      document.getElementById("shop-item-stock-row").hidden = itemType !== "title";
    }

    // 상품 추가/수정 모달 상태. modalMode: "add" | "edit", modalItemType: "regular" | "title"
    let modalMode = null;
    let modalItemId = null;
    let modalItemType = "regular";
    // 칭호 색 고르기 UI(chzzk-auth.js의 createTitleColorPicker) — 모달 처음 세팅할 때 한 번 만듦.
    let titleColorPicker = null;
    // 수정 중인 상품이 지금까지 팔린 개수 — 수정 창의 재고 칸은 "남은 수량"을 보여주고, 저장할 때
    // 서버가 쓰는 "전체 한정 수량"(= 팔린 개수 + 남은 수량)으로 바꿔서 보냄.
    let modalSoldCount = 0;

    function openShopItemModal(mode, itemId, itemType) {
      modalMode = mode;
      modalItemId = itemId ?? null;
      const idRow = document.getElementById("shop-item-id-row");
      const idInput = document.getElementById("shop-item-id-input");
      const nameInput = document.getElementById("shop-item-name-input");
      const descInput = document.getElementById("shop-item-desc-input");
      const costInput = document.getElementById("shop-item-cost-input");
      const cooldownInput = document.getElementById("shop-item-cooldown-input");
      const titlenameInput = document.getElementById("shop-item-titlename-input");
      const stockInput = document.getElementById("shop-item-stock-input");
      const liveInput = document.getElementById("shop-item-live-input");
      const overlayInput = document.getElementById("shop-item-overlay-input");
      const activeRow = document.getElementById("shop-item-active-row");
      const activeInput = document.getElementById("shop-item-active-input");
      const statusEl = document.getElementById("shop-item-modal-status");
      statusEl.textContent = "";
      statusEl.className = "status-msg";

      if (mode === "edit") {
        const item = shopItems.find((it) => it.id === itemId);
        modalItemType = item?.grants_title_id ? "title" : "regular";
        applyModalItemType(modalItemType);
        document.getElementById("shop-item-modal-title").textContent = modalItemType === "title" ? "칭호 상품 수정" : "상품 수정";
        idRow.hidden = true;
        idInput.value = item?.id ?? "";
        idInput.disabled = true;
        nameInput.value = item?.name ?? "";
        descInput.value = item?.description ?? "";
        costInput.value = item?.cost ?? "";
        cooldownInput.value = item?.cooldown_seconds ?? 0;
        titlenameInput.value = item?.titles?.name ?? "";
        titleColorPicker?.setColor(item?.titles?.color);
        // 재고 칸은 남은 수량(품절이면 0). 칭호를 회수하면 팔린 개수가 줄어서 재고가 다시 생김.
        modalSoldCount = Number(item?.sold_count ?? 0);
        stockInput.value = item?.stock_limit != null ? Math.max(0, item.stock_limit - modalSoldCount) : "";
        stockInput.min = "0";
        document.getElementById("shop-item-stock-label").textContent = "남은 수량 (비워두면 무제한)";
        const stockHelp = document.getElementById("shop-item-stock-help");
        stockHelp.textContent = `지금까지 ${modalSoldCount.toLocaleString("ko-KR")}개 팔렸어요. 품절된 상품도 여기 숫자를 늘리면 다시 팔 수 있어요.`;
        stockHelp.hidden = modalSoldCount === 0 && item?.stock_limit == null;
        liveInput.checked = Boolean(item?.requires_live);
        overlayInput.checked = item?.show_on_overlay !== false;
        activeRow.hidden = false;
        activeInput.checked = item?.is_active !== false;
        document.getElementById("shop-item-modal-submit-btn").textContent = "저장";
      } else {
        modalItemType = itemType === "title" ? "title" : "regular";
        applyModalItemType(modalItemType);
        document.getElementById("shop-item-modal-title").textContent = modalItemType === "title" ? "칭호 상품 추가" : "상품 추가";
        idRow.hidden = false;
        idInput.value = "";
        idInput.disabled = false;
        nameInput.value = "";
        descInput.value = "";
        costInput.value = "";
        cooldownInput.value = 0;
        titlenameInput.value = "";
        titleColorPicker?.setColor(DEFAULT_TITLE_COLOR);
        stockInput.value = "";
        stockInput.min = "1";
        modalSoldCount = 0;
        document.getElementById("shop-item-stock-label").textContent = "한정 수량 (비워두면 무제한)";
        document.getElementById("shop-item-stock-help").hidden = true;
        liveInput.checked = false;
        // 칭호 상품은 방송 화면에 굳이 안 떠도 되는 경우가 많아서 기본 꺼짐, 일반 상품은
        // 기존 동작 그대로 기본 켜짐.
        overlayInput.checked = modalItemType !== "title";
        activeRow.hidden = true;
        document.getElementById("shop-item-modal-submit-btn").textContent = "추가";
      }
      document.getElementById("shop-item-modal").showModal();
    }

    // 완전 삭제. 칭호 상품이면 그 칭호를 가진 유저 전원에게서 회수됨(서버가 칭호 자체를 지움) —
    // 산 사람은 그대로 두고 상점에서만 내리고 싶을 땐 "판매 중지"를 쓰라고 안내함.
    async function deleteShopItem(itemId) {
      const item = shopItems.find((it) => it.id === itemId);
      const label = item?.name ?? itemId;
      let confirmMsg;
      if (item?.grants_title_id) {
        const owners = Number(item.owner_count) || 0;
        confirmMsg = owners > 0
          ? `"${label}" 상품을 완전히 삭제할까요?\n\n이 칭호를 가진 유저 ${owners}명에게서 칭호가 회수돼요(되돌릴 수 없음).\n산 사람은 그대로 두고 상점에서만 내리려면 취소하고 "판매 중지"를 눌러주세요.`
          : `"${label}" 상품을 완전히 삭제할까요?\n\n아직 이 칭호를 가진 유저는 없어요.`;
      } else {
        confirmMsg = `"${label}" 상품을 완전히 삭제할까요?\n\n과거 구매 로그(포인트 내역)에는 영향 없어요. 잠깐 내리기만 하려면 "판매 중지"를 쓰세요.`;
      }
      if (!confirm(confirmMsg)) return;
      const statusEl = document.getElementById("global-status");
      try {
        const res = await authFetch(`${SHOP_ITEMS_URL}?id=${encodeURIComponent(itemId)}`, { method: "DELETE" });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(String(res.status));
        statusEl.className = "status-msg ok";
        statusEl.textContent = data.revokedOwners > 0
          ? `"${label}" 삭제 완료 — ${data.revokedOwners}명에게서 칭호를 회수했어요.`
          : `"${label}" 삭제 완료.`;
        await loadShopItems();
        renderShop();
      } catch (err) {
        console.error("[shop] 상품 삭제 실패", err);
        alert("삭제에 실패했어요.");
      }
    }

    // 판매 중지 ↔ 다시 판매. 판매 중지된 상품은 일반 유저 상점에서 안 보이고(이미 산 칭호는 유지),
    // 관리자 화면에선 섹션 아래 "판매 중지된 상품" 접힘 영역으로 옮겨감.
    async function toggleShopItemActive(itemId, btn) {
      const item = shopItems.find((it) => it.id === itemId);
      if (!item) return;
      const nextActive = item.is_active === false;
      btn.disabled = true;
      try {
        const res = await authFetch(`${SHOP_ITEMS_URL}?id=${encodeURIComponent(itemId)}`, {
          method: "PATCH",
          body: JSON.stringify({ isActive: nextActive }),
        });
        if (!res.ok) throw new Error(String(res.status));
        await loadShopItems();
        renderShop();
      } catch (err) {
        console.error("[shop] 판매 상태 변경 실패", err);
        alert("판매 상태를 바꾸지 못했어요.");
        btn.disabled = false;
      }
    }

    function setupShopItemModal() {
      const titlenameInput = document.getElementById("shop-item-titlename-input");
      titleColorPicker = createTitleColorPicker(document.getElementById("shop-item-titlecolor-picker"), {
        initialColor: DEFAULT_TITLE_COLOR,
        getPreviewName: () => titlenameInput.value,
      });
      titlenameInput.addEventListener("input", () => titleColorPicker.refreshPreview());
      document.getElementById("shop-item-add-btn").addEventListener("click", () => openShopItemModal("add", null, "regular"));
      document.getElementById("title-item-add-btn").addEventListener("click", () => openShopItemModal("add", null, "title"));
      document.getElementById("shop-item-modal-cancel-btn").addEventListener("click", () => {
        document.getElementById("shop-item-modal").close();
      });

      document.getElementById("shop-item-modal-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const statusEl = document.getElementById("shop-item-modal-status");
        const submitBtn = document.getElementById("shop-item-modal-submit-btn");

        const name = document.getElementById("shop-item-name-input").value.trim();
        const cost = Number(document.getElementById("shop-item-cost-input").value);
        if (!name) {
          statusEl.textContent = "상품명을 입력해주세요.";
          statusEl.className = "status-msg error";
          return;
        }
        if (!Number.isFinite(cost) || cost <= 0) {
          statusEl.textContent = "가격을 1 이상으로 입력해주세요.";
          statusEl.className = "status-msg error";
          return;
        }

        const payload = {
          name,
          description: document.getElementById("shop-item-desc-input").value.trim(),
          cost,
        };

        // 칭호 상품은 쿨타임/방송중 전용 개념이 없는 대신 지급할 칭호명이 필수 — 이 값 그대로가
        // titles 테이블에 새 칭호로 등록됨(기존 칭호 중에서 고르는 게 아님). 오버레이 알림은
        // 체크박스 없이 항상 꺼둠(칭호 구매는 방송 오버레이에 띄울 일이 없어서).
        if (modalItemType === "title") {
          const titleName = document.getElementById("shop-item-titlename-input").value.trim();
          if (!titleName) {
            statusEl.textContent = "지급할 칭호명을 입력해주세요.";
            statusEl.className = "status-msg error";
            return;
          }
          payload.titleName = titleName;
          payload.titleColor = titleColorPicker ? titleColorPicker.getColor() : DEFAULT_TITLE_COLOR;
          payload.showOnOverlay = false;

          const stockRaw = document.getElementById("shop-item-stock-input").value.trim();
          if (stockRaw) {
            const entered = Number(stockRaw);
            const isEdit = modalMode === "edit";
            if (!Number.isInteger(entered) || entered < (isEdit ? 0 : 1)) {
              statusEl.textContent = isEdit ? "남은 수량은 0 이상의 정수로 입력해주세요." : "한정 수량은 1 이상의 정수로 입력해주세요.";
              statusEl.className = "status-msg error";
              return;
            }
            // 수정 창에선 남은 수량을 입력받으니 서버에는 전체 한정 수량(팔린 개수 + 남은 수량)으로 보냄.
            const stockLimit = isEdit ? modalSoldCount + entered : entered;
            if (stockLimit <= 0) {
              statusEl.textContent = "아직 안 팔린 상품은 남은 수량을 1 이상으로 해주세요(내리려면 판매 중지).";
              statusEl.className = "status-msg error";
              return;
            }
            payload.stockLimit = stockLimit;
          } else {
            payload.stockLimit = null;
          }
        } else {
          payload.cooldownSeconds = Number(document.getElementById("shop-item-cooldown-input").value) || 0;
          payload.requiresLive = document.getElementById("shop-item-live-input").checked;
          payload.showOnOverlay = document.getElementById("shop-item-overlay-input").checked;
        }

        submitBtn.disabled = true;
        statusEl.textContent = "저장 중...";
        statusEl.className = "status-msg";
        try {
          let res;
          if (modalMode === "add") {
            const idValue = document.getElementById("shop-item-id-input").value.trim();
            if (!/^[a-z0-9][a-z0-9-]{0,63}$/.test(idValue)) {
              statusEl.textContent = "상품 id는 영문 소문자/숫자/하이픈만 가능해요 (첫 글자는 하이픈 불가).";
              statusEl.className = "status-msg error";
              submitBtn.disabled = false;
              return;
            }
            const body = { id: idValue, ...payload };
            if (modalItemType === "title") body.isTitleItem = true;
            res = await authFetch(SHOP_ITEMS_URL, { method: "POST", body: JSON.stringify(body) });
          } else {
            payload.isActive = document.getElementById("shop-item-active-input").checked;
            res = await authFetch(`${SHOP_ITEMS_URL}?id=${encodeURIComponent(modalItemId)}`, { method: "PATCH", body: JSON.stringify(payload) });
          }
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            if (data.error === "duplicate_id") statusEl.textContent = "이미 존재하는 상품 id예요.";
            else if (data.error === "invalid_id") statusEl.textContent = "상품 id 형식이 올바르지 않아요.";
            else if (data.error === "invalid_title_name") statusEl.textContent = "지급할 칭호명을 입력해주세요.";
            else if (data.error === "invalid_title_color") statusEl.textContent = "칭호 색상이 올바르지 않아요.";
            else if (data.error === "title_id_conflict") statusEl.textContent = "이미 사용된 상품 id예요(연결된 칭호가 남아있어요). 다른 id를 써주세요.";
            else if (data.error === "not_title_item") statusEl.textContent = "칭호 상품이 아니라서 칭호명을 저장할 수 없어요.";
            else statusEl.textContent = "저장에 실패했어요.";
            statusEl.className = "status-msg error";
            submitBtn.disabled = false;
            return;
          }
          document.getElementById("shop-item-modal").close();
          await loadShopItems();
          renderShop();
        } catch (err) {
          console.error("[shop] 상품 저장 실패", err);
          statusEl.textContent = "저장에 실패했어요.";
          statusEl.className = "status-msg error";
        } finally {
          submitBtn.disabled = false;
        }
      });
    }

    // 아이템별 쿨타임 종료 시각(ms epoch). 사용 성공 시 세팅하고, 남은 시간 동안 버튼을
    // 비활성화 + 카운트다운 표시함. 새로고침하면 초기화됨(서버가 진짜 소스, 이건 UX 보조용).
    const cooldownUntil = new Map();
    let cooldownTickTimer = null;

    function ensureCooldownTicker() {
      if (cooldownTickTimer) return;
      cooldownTickTimer = setInterval(() => {
        const now = Date.now();
        let anyActive = false;
        for (const until of cooldownUntil.values()) {
          if (until > now) anyActive = true;
        }
        renderShop();
        if (!anyActive) {
          clearInterval(cooldownTickTimer);
          cooldownTickTimer = null;
        }
      }, 1000);
    }

    async function useItem(itemId, btn) {
      const statusEl = document.getElementById("global-status");
      btn.disabled = true;
      statusEl.textContent = "";
      statusEl.className = "status-msg";
      try {
        const res = await authFetch(SPEND_POINTS_URL, {
          method: "POST",
          body: JSON.stringify({ itemId }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          if (data.error === "not_live") {
            statusEl.textContent = "지금은 방송 중이 아니에요.";
          } else if (data.error === "insufficient_balance") {
            statusEl.textContent = "포인트가 부족해요.";
          } else if (data.error === "item_not_found") {
            statusEl.textContent = "지금은 살 수 없는 상품이에요. 새로고침 후 다시 시도해주세요.";
          } else if (data.error === "cooldown") {
            const wait = Number.isFinite(data.retryAfterSeconds) ? data.retryAfterSeconds : null;
            statusEl.textContent = wait ? `너무 빨라요! ${wait}초 후에 다시 사용할 수 있어요.` : "너무 빨라요! 잠시 후 다시 시도해주세요.";
            if (wait) {
              cooldownUntil.set(itemId, Date.now() + wait * 1000);
              ensureCooldownTicker();
            }
          } else if (data.error === "already_owned") {
            statusEl.textContent = "이미 보유한 칭호예요.";
          } else if (data.error === "sold_out") {
            statusEl.textContent = "품절된 상품이에요.";
          } else if (data.error !== "banned") {
            statusEl.textContent = "사용에 실패했어요. 다시 시도해주세요.";
          }
          statusEl.classList.add("error");
          renderShop(); // 방송 상태 등이 그 사이 바뀌었을 수 있으니 최신 값으로 다시 그림
          return;
        }
        currentBalance = data.balance ?? currentBalance;
        document.getElementById("balance-value").textContent = currentBalance.toLocaleString("ko-KR");
        if (data.titleGranted) {
          purchasedTitleIds.add(data.titleGranted.id);
          statusEl.textContent = `"${data.titleGranted.name}" 칭호를 획득했어요! 마이페이지에서 장착할 수 있어요.`;
        } else {
          statusEl.textContent = `${data.item?.name ?? "아이템"} 사용했어요! (-${(data.item?.cost ?? 0).toLocaleString("ko-KR")}P)`;
        }
        statusEl.classList.add("ok");
        if (data.item?.cooldownSeconds > 0) {
          cooldownUntil.set(itemId, Date.now() + data.item.cooldownSeconds * 1000);
          ensureCooldownTicker();
        }
        renderShop();
      } catch (err) {
        console.error("[shop] 사용 실패", err);
        statusEl.textContent = "사용에 실패했어요. 다시 시도해주세요.";
        statusEl.classList.add("error");
        btn.disabled = false;
      }
    }

    renderSidebarUser();
    initSidebarToggle();
    initAdminNav();
    initShopNavGroup();
    initNoticeBadge();

    (async () => {
      const loadingEl = document.getElementById("loading-state");
      if (!isLoggedIn()) {
        loadingEl.hidden = true;
        document.getElementById("logged-out").hidden = false;
        return;
      }
      ({ supabase } = await import("./assets/js/supabase-client.js"));
      const res = await authFetch(ME_URL);
      if (!res.ok) {
        loadingEl.hidden = true;
        document.getElementById("logged-out").hidden = false;
        return;
      }
      const profile = await res.json();
      currentBalance = profile.balance;
      purchasedTitleIds = new Set(profile.purchasedTitleIds ?? []);
      document.getElementById("balance-value").textContent = currentBalance.toLocaleString("ko-KR");
      loadingEl.hidden = true;
      document.getElementById("logged-in").hidden = false;

      if (isAdmin()) {
        document.getElementById("shop-item-toolbar").hidden = false;
        document.getElementById("title-item-toolbar").hidden = false;
        setupShopItemModal();
        setupReorderControls();
      }

      await Promise.all([loadShopItems(), loadLiveStatus()]);
      renderShop();

      // 어느 섹션(일반 상점/칭호 상점)을 보여줄지 결정. window.__pendingShopScrollTarget은
      // 다른 페이지에서 사이드바 하위 링크를 눌러 여기로 넘어온 경우 initShopNavGroup()이
      // 남겨둔 값 — 이 시점엔 location.hash가 아직 안 바뀌어 있어서(spa-router가 pushState를
      // 스크립트 실행보다 나중에 함) 이걸로 대신 읽음. 직접 주소창에 해시를 넣고 들어왔거나
      // 뒤로/앞으로 가기(popstate)로 왔을 땐 location.hash가 이미 맞게 갱신돼 있으니 그걸
      // 쓰고, 둘 다 없으면(그냥 shop.html로 바로 들어온 경우) 일반 상점을 기본으로 보여줌.
      const target = window.__pendingShopScrollTarget || (location.hash ? location.hash.slice(1) : null) || "general-shop-section";
      window.__pendingShopScrollTarget = null;
      showShopSection(target);
    })();
  })();
  </script>
</body>
</html>
