</head>
<body>
  <script>
    if (localStorage.getItem("chzzk_points_sidebar_collapsed") === "1") {
      document.body.classList.add("sidebar-collapsed");
    }
  </script>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-top">
        <a href="index.html" class="sidebar-brand">
          <span class="mark">C</span>
          <span class="label">chzzk-points</span>
        </a>
        <button type="button" id="sidebar-toggle" class="sidebar-toggle-btn" aria-label="사이드바 접기/펴기" title="사이드바 접기/펴기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></span>
          <span class="label">홈</span>
        </a>
        <a href="notice.html">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M8 9h8"/><path d="M8 13h8"/><path d="M8 17h4"/></svg></span>
          <span class="label">공지사항</span>
        </a>
        <a href="mypage.html">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg></span>
          <span class="label">마이페이지</span>
        </a>
        <a href="ranking.html">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 5H4v2a4 4 0 0 0 4 4"/><path d="M16 5h4v2a4 4 0 0 1-4 4"/><path d="M12 13v3"/><path d="M9 20h6"/><path d="M10 20v-2h4v2"/></svg></span>
          <span class="label">랭킹</span>
        </a>
        <a href="shop.html" class="active">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></span>
          <span class="label">소모처</span>
        </a>
        <a href="admin.html" id="admin-nav-link" hidden>
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l7 4v6c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6l7-4z"/></svg></span>
          <span class="label">관리자</span>
        </a>
      </nav>
      <div class="sidebar-user" id="sidebar-user"></div>
    </aside>

    <main class="main-content">
      <h1>포인트 소모처</h1>

      <div id="loading-state" class="card">
        <p class="muted">현재 포인트</p>
        <p class="skeleton skeleton-line" style="width:120px;height:28px;margin-top:6px;"></p>
      </div>

      <div id="logged-out" class="card" hidden>
        <p>로그인하면 소모처를 이용할 수 있어요.</p>
        <button onclick="spaNavigate('index.html')">홈으로 가서 로그인</button>
      </div>

      <div id="logged-in" hidden>
        <div class="card">
          <p class="muted">현재 포인트</p>
          <p class="balance"><span id="balance-value">0</span><span class="unit">P</span></p>
        </div>
        <div class="shop-grid" id="shop-list"></div>
        <p id="global-status" class="status-msg"></p>
      </div>
    </main>
  </div>

  <script src="assets/js/chzzk-auth.js?v=3"></script>
  <script src="assets/js/spa-router.js?v=4"></script>
  <script>
  // spa-router.js가 페이지 이동마다 이 스크립트를 다시 실행하므로 IIFE로 감싼다
  // (SHOP_ITEMS/currentBalance가 최상위 const/let이면 두 번째 실행에서 에러가 남).
  (function () {
    renderSidebarUser();
    initSidebarToggle();
    initAdminNav();

    // 플레이스홀더 아이템 — 실제 소모처가 정해지면 이 배열만 바꾸면 됨.
    // id는 spend-points 함수 구현될 때 서버 쪽 가격 검증에도 그대로 쓸 값.
    const SHOP_ITEMS = [
      { id: "item-a", name: "아이템 A", cost: 100, desc: "설명 자리 (플레이스홀더)" },
      { id: "item-b", name: "아이템 B", cost: 300, desc: "설명 자리 (플레이스홀더)" },
      { id: "item-c", name: "아이템 C", cost: 1000, desc: "설명 자리 (플레이스홀더)" },
    ];

    let currentBalance = 0;

    function renderShop() {
      const listEl = document.getElementById("shop-list");
      listEl.innerHTML = SHOP_ITEMS.map((item) => {
        const affordable = currentBalance >= item.cost;
        return `
          <div class="card shop-item">
            <h3>${item.name}</h3>
            <p class="desc">${item.desc}</p>
            <p class="cost">${item.cost.toLocaleString("ko-KR")}P</p>
            <button data-item-id="${item.id}" ${affordable ? "" : "disabled"}>
              ${affordable ? "사용" : "잔액 부족"}
            </button>
          </div>`;
      }).join("");

      listEl.querySelectorAll("button[data-item-id]").forEach((btn) => {
        btn.addEventListener("click", () => useItem(btn.dataset.itemId, btn));
      });
    }

    async function useItem(itemId, btn) {
      const statusEl = document.getElementById("global-status");
      btn.disabled = true;
      statusEl.textContent = "";
      statusEl.className = "status-msg";
      try {
        const res = await authFetch(SPEND_POINTS_URL, {
          method: "POST",
          body: JSON.stringify({ itemId }),
        });
        if (res.status === 501) {
          // 아직 구현 전인 백엔드 — UI 동작 자체는 정상이라는 걸 알려줌
          statusEl.textContent = "소모처 기능은 아직 준비 중이에요 (백엔드 구현 예정).";
          statusEl.classList.add("error");
          return;
        }
        if (!res.ok) throw new Error(String(res.status));
        const data = await res.json();
        currentBalance = data.balance ?? currentBalance;
        document.getElementById("balance-value").textContent = currentBalance.toLocaleString("ko-KR");
        statusEl.textContent = "사용했어요!";
        statusEl.classList.add("ok");
        renderShop();
      } catch (err) {
        statusEl.textContent = "사용에 실패했어요.";
        statusEl.classList.add("error");
      } finally {
        btn.disabled = false;
      }
    }

    (async () => {
      const loadingEl = document.getElementById("loading-state");
      if (!isLoggedIn()) {
        loadingEl.hidden = true;
        document.getElementById("logged-out").hidden = false;
        return;
      }
      const res = await authFetch(ME_URL);
      if (!res.ok) {
        loadingEl.hidden = true;
        document.getElementById("logged-out").hidden = false;
        return;
      }
      const profile = await res.json();
      currentBalance = profile.balance;
      document.getElementById("balance-value").textContent = currentBalance.toLocaleString("ko-KR");
      loadingEl.hidden = true;
      document.getElementById("logged-in").hidden = false;
      renderShop();
    })();
  })();
  </script>
</body>
</html>
