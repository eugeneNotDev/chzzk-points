<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>overlay · 유진 팬보드</title>
<style>
  /* OBS 브라우저 소스용 — 배경 완전 투명, 공통 style.css는 안 씀 (다크 배경이라 방송화면에 안 맞음) */
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #overlay-root {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start;
    padding: 24px;
    font-family: system-ui, "Noto Sans KR", sans-serif;
    pointer-events: none;
  }
  .toast {
    background: rgba(20, 24, 28, 0.85);
    color: #fff;
    border-radius: 10px;
    padding: 10px 16px;
    margin-top: 8px;
    font-size: 1.1rem;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    animation: toast-in 0.25s ease-out, toast-out 0.4s ease-in 4.6s forwards;
  }
  .toast .who { color: #7fd1ff; font-weight: 700; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes toast-out { to { opacity: 0; transform: translateY(-8px); } }
</style>
</head>
<body>
  <!-- OBS 브라우저 소스로 이 페이지를 추가함. 배경 투명 처리 이미 돼있음. -->
  <div id="overlay-root"></div>

  <script type="module">
    import { supabase } from "./assets/js/supabase-client.js";

    const root = document.getElementById("overlay-root");

    // 알림음 — 원본 파일 자체를 절반 볼륨으로 미리 낮춰서 넣어둠(assets/audio/spend-alert.mp3).
    // 재생할 때마다 새 Audio 인스턴스를 만듦 — 연타로 여러 개 뜰 때 소리끼리 끊기지 않고 겹쳐서 남.
    const ALERT_SOUND_URL = "./assets/audio/spend-alert.mp3";
    function playAlertSound() {
      const audio = new Audio(ALERT_SOUND_URL);
      audio.play().catch((err) => {
        // 자동재생이 막히는 특수한 경우가 있을 수 있어 조용히 무시 (OBS 브라우저 소스는 보통 허용됨).
        console.error("[overlay] 알림음 재생 실패", err);
      });
    }

    // 소모처별 연출 문구 — item_id에 맞춰 나중에 늘리면 됨 (지금은 공통 문구).
    // item_name: spend-points가 지급 시점 shop_items.name을 스냅샷으로 남긴 값(0018_bugfixes.sql).
    // 예전엔 이게 없어서 item_id(내부 슬러그, 예: "water"/"temp1")가 그대로 노출됐었음 — 혹시
    // 예전 이벤트라 item_name이 비어있는 경우를 대비해 item_id로 폴백.
    // is_public: spend-points가 사용 시점 마이페이지 공개 설정을 같이 스냅샷으로 남긴 값
    // (0029_spend_events_is_public.sql) — 비공개 유저면 이름 대신 "익명"으로 표시함(랭킹은
    // 이미 비공개 처리가 있었는데 오버레이만 빠져있었던 걸 맞춤). is_public===false로 명시적일
    // 때만 익명 처리하고, 이 컬럼이 생기기 전 과거 행(undefined)은 기존처럼 실명 그대로 둠.
    function renderToast(event) {
      const el = document.createElement("div");
      el.className = "toast";
      const itemLabel = event.item_name || event.item_id;
      const whoLabel = event.is_public === false ? "익명" : (event.channel_name || event.channel_id);
      el.innerHTML = `<span class="who">${escapeHtml(whoLabel)}</span>님이 <b>${escapeHtml(itemLabel)}</b> 사용!`;
      root.appendChild(el);
      playAlertSound();
      // 애니메이션 끝나면 DOM에서 제거 (누적 방지)
      setTimeout(() => el.remove(), 5200);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    supabase
      .channel("spend_events_overlay")
      .on(
        "postgres_changes",
        { event: "INSERT", schema: "public", table: "spend_events" },
        (payload) => renderToast(payload.new),
      )
      .subscribe();
  </script>
</body>
</html>
