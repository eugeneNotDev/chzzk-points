<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>overlay · 유진 팬보드</title>
<style>
  /* OBS 브라우저 소스용 — 배경 완전 투명, 공통 style.css는 안 씀 (다크 배경이라 방송화면에 안 맞음) */
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #overlay-root {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start;
    padding: 24px;
    font-family: system-ui, "Noto Sans KR", sans-serif;
    pointer-events: none;
  }
  .toast {
    background: rgba(20, 24, 28, 0.85);
    color: #fff;
    border-radius: 10px;
    padding: 10px 16px;
    margin-top: 8px;
    font-size: 1.1rem;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    animation: toast-in 0.25s ease-out, toast-out 0.4s ease-in 4.6s forwards;
  }
  .toast .who { color: #7fd1ff; font-weight: 700; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes toast-out { to { opacity: 0; transform: translateY(-8px); } }
</style>
</head>
<body>
  <!-- OBS 브라우저 소스로 이 페이지를 추가함. 배경 투명 처리 이미 돼있음. -->
  <div id="overlay-root"></div>

  <script type="module">
    import { supabase } from "./assets/js/supabase-client.js";

    const root = document.getElementById("overlay-root");

    // 알림음 — 원본 파일 자체를 절반 볼륨으로 미리 낮춰서 넣어둠(assets/audio/spend-alert.mp3).
    // 재생할 때마다 새 Audio 인스턴스를 만듦 — 연타로 여러 개 뜰 때 소리끼리 끊기지 않고 겹쳐서 남.
    const ALERT_SOUND_URL = "./assets/audio/spend-alert.mp3";
    function playAlertSound() {
      const audio = new Audio(ALERT_SOUND_URL);
      audio.play().catch((err) => {
        // 자동재생이 막히는 특수한 경우가 있을 수 있어 조용히 무시 (OBS 브라우저 소스는 보통 허용됨).
        console.error("[overlay] 알림음 재생 실패", err);
      });
    }

    // 상점 사용 알림. overlay_events 한 줄 = 알림 하나(0044_privacy_hardening.sql).
    // spend_events(상점 사용 원본 기록 — 실제 이름·채널 ID가 들어있음)는 이제 서버 전용이라 여기서 못 읽음.
    // 대신 spend_events에 기록이 생길 때 DB 트리거가 화면에 보여줄 것만 담아 overlay_events에 넣어줌:
    //   display_name: 공개 유저면 이름, 비공개 유저면 null → "익명"으로 표시
    //   item_name: 사용 시점 상품 이름(예전 기록처럼 이름이 없으면 상품 id)
    function renderToast(event) {
      const el = document.createElement("div");
      el.className = "toast";
      const itemLabel = event.item_name || "상품";
      const whoLabel = event.display_name || "익명";
      el.innerHTML = `<span class="who">${escapeHtml(whoLabel)}</span>님이 <b>${escapeHtml(itemLabel)}</b> 사용!`;
      root.appendChild(el);
      playAlertSound();
      // 애니메이션 끝나면 DOM에서 제거 (누적 방지)
      setTimeout(() => el.remove(), 5200);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    supabase
      .channel("overlay_events_overlay")
      .on(
        "postgres_changes",
        { event: "INSERT", schema: "public", table: "overlay_events" },
        (payload) => renderToast(payload.new),
      )
      .subscribe();
  </script>
</body>
</html>
