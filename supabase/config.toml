# Edge Functions 설정.
#
# 이 프로젝트는 Supabase Auth를 안 쓰고 자체 세션 토큰(치지직 OAuth 기반, _shared/session.ts)을 쓴다.
# 그래서 Supabase가 기본으로 요구하는 "Authorization 헤더에 Supabase JWT 필수" 검증을 함수마다 꺼두고,
# 각 함수 안에서 우리 세션 토큰(또는 함수별 키)을 직접 검증한다.
#
# ⚠ 함수를 새로 만들면 여기에 꼭 추가할 것. 빠져 있으면 `supabase functions deploy`가 검증을 켜서
#    그 함수가 모든 요청을 막아버림(지금 서버에 올라간 함수는 전부 verify_jwt = false).

[functions.oauth-callback]
verify_jwt = false

