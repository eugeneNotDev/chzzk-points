<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0c0f" />
    <title>유진 팬보드 (베타)</title>
    <meta name="description" content="유진 알파 치지직 방송 팬 포인트 사이트" />
    <!-- 링크 공유 미리보기(카톡·디스코드 등). 베타(/beta/)·교체 빌드 모두 같은 대표 주소·그림을 쓰도록 절대 주소로 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="유진 팬보드" />
    <meta property="og:title" content="유진 팬보드" />
    <meta property="og:description" content="유진 알파 치지직 방송 팬 포인트 사이트" />
    <meta property="og:url" content="https://eugene4lpha.com/" />
    <meta property="og:image" content="https://eugene4lpha.com/assets/img/app-icon-192.png" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/assets/img/app-icon-192.png" />
    <!-- 칭호 배경 전용 글꼴: 생체 모니터(X-17) Tektur, 상담실(상담사) 명조체. 한글은 쓰인 글자 조각만 받아옴 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&family=Tektur:wght@700&display=swap" />
    <script>
      // 테마를 화면이 그려지기 전에 먼저 적용(깜빡임 방지). 저장 키는 기존 사이트와 같음.
      (function () {
        var t = null;
        try { t = localStorage.getItem("chzzk_points_theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
