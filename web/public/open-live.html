<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>방송 보러 가기 · 유진 팬보드</title>
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("chzzk_points_theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  /* 옛 사이트 style.css(188KB)를 안 받아오게 이 페이지에 필요한 것만 직접 넣음. 색은 사이트 tokens.css와 같은 값 */
  :root { --bg: #0a0c0f; --text: #f1f4f6; --muted: #8a939c; --accent: #00e5a0; --accent-ink: #03130d; color-scheme: dark; }
  :root[data-theme="light"] { --bg: #f4f6f8; --text: #14171b; --muted: #5f6872; --accent: #00b07a; --accent-ink: #ffffff; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text);
    font-family: "Pretendard Variable", Pretendard, system-ui, -apple-system, "Noto Sans KR", sans-serif; -webkit-tap-highlight-color: transparent; }
  .open-live { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 32px 20px; text-align: center; max-width: 360px; width: 100%; }
  .open-live h1 { margin: 6px 0 0; font-size: 1.45rem; }
  .open-live p { margin: 0 0 8px; color: var(--muted); font-size: 0.9rem; }
  .open-live-icon { width: 72px; height: 72px; border-radius: 18px; }
  .open-live-btn { display: block; width: 100%; padding: 13px 16px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 800; text-decoration: none; text-align: center; }
  .open-live-sub { color: var(--muted); font-size: 0.9rem; padding: 6px; }
</style>
</head>
<body>
  <!-- 방송 알림을 눌렀을 때 오는 중간 페이지(sw.js). 알림에서 바로 치지직 주소를 열면 앱이 아니라 웹(크롬)으로 열려서,
       여기서 버튼을 누르면 안드로이드는 치지직 앱을 직접 지정해서 엶(앱이 없으면 웹으로). -->
  <main class="open-live">
    <img src="assets/img/app-icon-192.png" alt="" class="open-live-icon">
    <h1>유진 방송 시작!</h1>
    <p>아래 버튼을 누르면 방송으로 가요.</p>
    <a class="open-live-btn" id="open-live-app">치지직 앱으로 보기</a>
    <a class="open-live-sub" id="open-live-web">웹으로 보기</a>
    <a class="open-live-sub" href="index.html">팬보드로 가기</a>
  </main>
  <script>
    // 자동으로 넘기지 않음 — 크롬은 사용자가 직접 누르지 않은 앱 열기를 막아서 웹으로 빠졌고, 그 뒤 닫기(X)를 누르면
    // 이 페이지로 돌아와 또 이동하는 무한 반복이 생겼음. 버튼을 직접 누르면 치지직 앱이 열림(실기기 확인).
    (function () {
      var CHANNEL = "37a1acfaa35d56311bf428dc96142e9f";
      var PKG = "com.navercorp.game.android.community"; // 치지직 안드로이드 앱(구글 플레이 기준)
      var web = "https://chzzk.naver.com/live/" + CHANNEL;
      var isAndroid = /Android/i.test(navigator.userAgent);
      function intentFor(host, fallback) {
        return "intent://" + host + "/live/" + CHANNEL + "#Intent;scheme=https;package=" + PKG +
          (fallback ? ";S.browser_fallback_url=" + encodeURIComponent(web) : "") + ";end";
      }
      document.getElementById("open-live-app").href = isAndroid ? intentFor("chzzk.naver.com", true) : web;
      document.getElementById("open-live-web").href = web;
    })();
  </script>
</body>
</html>
